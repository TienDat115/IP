<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lịch sử xem phim - CinePhim</title>
		<!-- Favicon -->
		<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
		<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
		<script src="../js/firebase-config.js"></script>
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
		<link rel="stylesheet" href="css/styles.css" />
		<style>
			@media (max-width: 639px) {
				#watchHistoryGrid {
					grid-template-columns: repeat(2, 1fr);
				}
			}
			@media (min-width: 640px) and (max-width: 767px) {
				#watchHistoryGrid {
					grid-template-columns: repeat(3, 1fr);
				}
			}
			@media (min-width: 768px) and (max-width: 1023px) {
				#watchHistoryGrid {
					grid-template-columns: repeat(4, 1fr);
				}
			}
			@media (min-width: 1024px) and (max-width: 1279px) {
				#watchHistoryGrid {
					grid-template-columns: repeat(5, 1fr);
				}
			}
			@media (min-width: 1280px) {
				#watchHistoryGrid {
					grid-template-columns: repeat(6, 1fr);
				}
			}
		</style>
	</head>

	<body class="home-body dark">
		<!-- Header -->
		<div id="siteHeader"></div>

		<!-- Breadcrumb -->
		<div class="container mx-auto px-4 pt-4">
			<nav class="home-breadcrumb">
				<a href="index.html">Trang chủ</a>
				<i class="fas fa-chevron-right text-xs"></i>
				<span>Lịch sử xem phim</span>
			</nav>
		</div>

		<!-- Main Content -->
		<main class="container mx-auto px-4 py-8">
			<div class="flex flex-col sm:flex-row justify-between items-center gap-3 mb-6">
				<h1 class="browse-title"><i class="fas fa-history mr-3"></i>Lịch sử xem phim</h1>
				<div class="flex flex-wrap justify-center gap-2">
					<button onclick="removeDuplicateHistory()" class="btn-clear">
						<i class="fas fa-compress-alt mr-2"></i>
						<span class="hidden sm:inline">Xóa trùng lặp</span>
					</button>
					<button onclick="refreshWatchHistory()" class="btn-clear">
						<i class="fas fa-sync mr-2"></i>
						<span class="hidden sm:inline">Làm mới</span>
					</button>
					<button onclick="clearWatchHistory()" class="btn-clear" style="color:#f87171">
						<i class="fas fa-trash mr-2"></i>
						<span class="hidden sm:inline">Xóa tất cả</span>
					</button>
				</div>
			</div>
			<div id="watchHistoryGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
				<!-- Watch history items will be loaded here -->
			</div>

			<!-- Pagination -->
			<div id="pagination" class="flex justify-center items-center mt-8 space-x-2">
				<!-- Pagination buttons will be loaded here -->
			</div>
		</main>

		<!-- Footer -->
		<div id="siteFooter"></div>

		<script src="js/config.js"></script>
		<script src="js/layout.js"></script>
		<script src="js/common.js"></script>
		<script src="js/watch-history.js"></script>
		<script>initPageSync();</script>

	</body>
</html>
