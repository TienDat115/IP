		<!-- Mobile Menu JavaScript -->
		<script>
			// Mobile menu toggle
			const mobileMenuToggle = document.getElementById("mobileMenuToggle");
			const mobileMenu = document.getElementById("mobileMenu");
			const mobileCategorySelect = document.getElementById("mobileCategorySelect");
			const desktopCategorySelect = document.getElementById("categorySelect");

			// Mobile menu toggle event
			if (mobileMenuToggle) {
				mobileMenuToggle.addEventListener("click", toggleMobileMenu);
			}

			// Sync mobile and desktop category select
			if (mobileCategorySelect && desktopCategorySelect) {
				mobileCategorySelect.addEventListener("change", function (e) {
					desktopCategorySelect.value = e.target.value;
					// Trigger change event
					const event = new Event("change");
					desktopCategorySelect.dispatchEvent(event);
				});

				desktopCategorySelect.addEventListener("change", function (e) {
					mobileCategorySelect.value = e.target.value;
				});
			}

			// Close mobile menu when clicking outside
			document.addEventListener("click", function (e) {
				if (mobileMenu && !mobileMenu.classList.contains("hidden")) {
					if (!mobileMenu.contains(e.target) && !mobileMenuToggle.contains(e.target)) {
						closeMobileMenu();
					}
				}
			});

			// Sync theme icons
			function syncThemeIcons() {
				const desktopIcon = document.getElementById("themeIcon");
				const mobileIcon = document.getElementById("mobileThemeIcon");

				if (desktopIcon && mobileIcon) {
					if (desktopIcon.classList.contains("fa-moon")) {
						mobileIcon.className = "fas fa-moon";
					} else {
						mobileIcon.className = "fas fa-sun";
					}
				}
			}

			// Sync login icons
			function syncLoginIcons() {
				const desktopIcon = document.getElementById("loginIcon");
				const mobileIcon = document.getElementById("mobileLoginIcon");
				const desktopText = document.getElementById("loginText");

				if (desktopIcon && mobileIcon) {
					mobileIcon.className = desktopIcon.className;
					if (desktopText && desktopText.textContent === "Đăng xuất") {
						mobileIcon.className = "fas fa-sign-out-alt";
					} else {
						mobileIcon.className = "fas fa-sign-in-alt";
					}
				}
			}

			// Override toggleTheme to sync icons
			const originalToggleTheme = window.toggleTheme;
			window.toggleTheme = function () {
				originalToggleTheme();
				syncThemeIcons();
			};

			// Override toggleLogin to sync icons
			const originalToggleLogin = window.toggleLogin;
			window.toggleLogin = function () {
				originalToggleLogin();
				syncLoginIcons();
			};

			// Initial sync
			setTimeout(() => {
				syncThemeIcons();
				syncLoginIcons();
			}, 100);
		</script>
