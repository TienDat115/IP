<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Ghi chú thời gian xem - CinePhim</title>
		<meta name="description" content="Quản lý ghi chú thời gian xem phim của bạn" />

		<!-- Favicon -->
		<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
		<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />

		<!-- Firebase SDK -->
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
		<script src="../js/firebase-config.js"></script>

		<!-- Tailwind CSS -->
		<script src="https://cdn.tailwindcss.com"></script>

		<!-- SweetAlert2 -->
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

		<!-- Custom CSS -->
		<link rel="stylesheet" href="css/styles.css" />
		<style>
			.swal-input-custom { font-size: 14px !important; padding: 10px 12px !important; margin: 6px 0 !important; border-radius: 8px !important; background: #374151 !important; color: #fff !important; border: 1px solid #4b5563 !important; box-shadow: none !important; width: 100% !important; box-sizing: border-box !important; }
			.swal-input-custom:focus { border-color: #7c3aed !important; outline: none !important; }
			.swal-input-custom::placeholder { color: #9ca3af !important; }
			.swal-btn-custom { font-size: 14px !important; padding: 10px 28px !important; border-radius: 8px !important; }
			.swal-msg-custom { font-size: 12px !important; margin: 4px 0 !important; }
			@media (max-width: 640px) {
				.swal2-popup { margin: 8px !important; padding: 16px !important; }
				.swal2-title { font-size: 18px !important; }
				.swal-input-custom { font-size: 16px !important; padding: 12px !important; }
				.swal-btn-custom { font-size: 16px !important; padding: 12px 32px !important; width: 100% !important; }
			}
		</style>
	</head>

	<body class="home-body dark">
		<!-- Header -->
		<div id="siteHeader"></div>

		<!-- Breadcrumb -->
		<div class="container mx-auto px-4 pt-4">
			<nav class="home-breadcrumb">
				<a href="index.html">Trang chủ</a>
				<i class="fas fa-chevron-right text-xs"></i>
				<span>Ghi chú thời gian</span>
			</nav>
		</div>

		<!-- Main Content -->
		<main class="container mx-auto px-4 py-8">
			<!-- Page Title -->
			<div class="text-center mb-8">
				<h1 class="browse-title mb-4"><i class="fas fa-sticky-note mr-3"></i>Ghi chú thời gian xem</h1>
				<p class="browse-subtitle max-w-2xl mx-auto mb-4">Quản lý và sửa thời gian ghi chú của tất cả các phim</p>
				<div class="max-w-lg mx-auto mb-4 flex gap-2">
					<div class="relative flex-1">
						<input id="noteSearchInput" type="text" placeholder="Tìm kiếm theo tên phim..." class="w-full bg-gray-800 text-white rounded-lg pl-10 pr-4 py-2 sm:py-2.5 border border-gray-700 focus:border-purple-500 outline-none text-sm transition" />
						<i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
					</div>
					<select id="sortSelect" onchange="changeSortOrder()" class="bg-gray-800 text-white rounded-lg px-3 py-2 border border-gray-700 focus:border-purple-500 outline-none text-sm transition cursor-pointer">
						<option value="updatedAt_desc">Mới nhất</option>
						<option value="updatedAt_asc">Cũ nhất</option>
						<option value="movieTitle_asc">Tên phim A-Z</option>
						<option value="movieTitle_desc">Tên phim Z-A</option>
					</select>
				</div>
			</div>

			<!-- Notes Container -->
			<div id="notesContainer" class="max-w-4xl mx-auto space-y-4"></div>

			<!-- Pagination -->
			<div id="pagination" class="flex justify-center items-center mt-8 space-x-2"></div>
		</main>

		<!-- Footer -->
		<div id="siteFooter"></div>

		<!-- Scripts -->
		<script src="js/config.js"></script>
		<script src="js/layout.js"></script>
		<script src="js/common.js"></script>

		<script src="js/watch-time-notes.js"></script>
		<script>initPageSync();</script>

	</body>
</html>
