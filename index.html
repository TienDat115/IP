<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/x-icon" href="https://img.icons8.com/ios/50/000000/user-male-circle.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Chọn Dịch Vụ Gửi Tin Nhắn</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>

		<!-- Firebase configuration -->
		<script src="js/firebase-config.js"></script>
		<style>
			body {
				background-color: #f8f9fa;
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				margin: 0;
				padding: 20px;
			}
			.container {
				max-width: 500px;
			}
			.card {
				border-radius: 10px;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
				border: none;
			}
			.card-header {
				background-color: #0088cc;
				color: white;
				font-weight: bold;
				padding: 12px 20px;
				border-radius: 10px 10px 0 0;
				text-align: center;
			}
			.card-body {
				padding: 30px;
			}
			.btn-service {
				background-color: #0088cc;
				border: none;
				padding: 12px;
				width: 100%;
				font-weight: 500;
				margin-bottom: 15px;
				color: white;
			}
			.btn-service:hover {
				background-color: #006699;
			}
			.btn-logout {
				background-color: #dc3545;
				border: none;
				padding: 10px;
				width: 100%;
				font-weight: 500;
				color: white;
			}
			.btn-logout:hover {
				background-color: #c82333;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="card">
				<div class="card-header">
					<h4 class="mb-0">Chọn Dịch Vụ</h4>
				</div>
				<div class="card-body">
					<p class="text-center mb-4">Chọn nền tảng để gửi tin nhắn:</p>
					<a href="SendDiscordMessage.html" class="btn btn-service">Gửi Tin Nhắn Discord</a>
					<a href="SendTelegramMessage.html" class="btn btn-service">Gửi Tin Nhắn Telegram</a>
					<button class="btn btn-logout" onclick="logout()">Đăng Xuất</button>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
		<script>
			// Initialize Firebase
			firebase.initializeApp(firebaseConfig);
			const auth = firebase.auth();

			// Check auth state and redirect to login if not authenticated
			auth.onAuthStateChanged((user) => {
				if (!user) {
					window.location.href = "login.html";
				}
			});

			// Handle logout
			async function logout() {
				try {
					await auth.signOut();
					Swal.fire({
						icon: "success",
						title: "Đăng xuất thành công",
						toast: true,
						position: "top-end",
						showConfirmButton: false,
						timer: 2000,
						timerProgressBar: true,
					}).then(() => {
						window.location.href = "login.html";
					});
				} catch (error) {
					console.error("Lỗi đăng xuất:", error);
					Swal.fire({
						icon: "error",
						title: "Lỗi",
						text: "Đã xảy ra lỗi khi đăng xuất. Vui lòng thử lại.",
						toast: true,
						position: "top-end",
						showConfirmButton: false,
						timer: 3000,
						timerProgressBar: true,
					});
				}
			}
		</script>
	</body>
</html>
