<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dự báo thời tiết</title>
		<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
		<link href="css/tabs.css" rel="stylesheet" />
		<style>
			body {
				font-family: "Inter", sans-serif;
				background: #111827; /* Màu tương đương với bg-gray-900 */
				height: 100vh;
				margin: 0;
				padding: 0;
				color: #e5e7eb;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.container {
				width: 100%;
				max-width: 100%;
				height: 475px;
				overflow: hidden;
				padding: 10px;
			}

			.weather-container {
				background: rgba(255, 255, 255, 0.05);
				backdrop-filter: blur(8px);
				border: 1px solid rgba(59, 130, 246, 0.2);
				border-radius: 1.5rem;
				padding: 1.25rem;
				height: 100%;
				overflow: hidden;
				display: flex;
				flex-direction: column;
				box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
			}

			.weather-card {
				background: rgba(31, 41, 55, 0.3);
				border-radius: 1rem;
				padding: 1rem;
				transition: all 0.2s ease;
				border: 1px solid rgba(59, 130, 246, 0.1);
				margin-bottom: 0.75rem;
				backdrop-filter: blur(4px);
				flex: 1;
				display: flex;
				flex-direction: column;
				overflow: hidden;
				animation: slideIn 0.3s ease-out;
			}

			.city-btn {
				padding: 0.3rem 0.7rem;
				border-radius: 0.5rem;
				font-size: 0.75rem;
				color: #9ca3af;
				transition: all 0.2s ease;
				background: rgba(31, 41, 55, 0.6);
				border: 1px solid rgba(59, 130, 246, 0.2);
				font-weight: 500;
				backdrop-filter: blur(3px);
				margin: 0.1rem;
			}

			.city-btn:hover {
				transform: translateY(-1px);
				box-shadow: 0 2px 8px rgba(59, 130, 246, 0.1);
			}

			.city-btn.active {
				background: linear-gradient(135deg, #3b82f6, #06b6d4);
				color: white;
				box-shadow: 0 2px 8px rgba(59, 130, 246, 0.2);
				border: 1px solid rgba(59, 130, 246, 0.3);
			}

			.weather-icon {
				width: 4rem;
				height: 4rem;
				transition: transform 0.2s ease;
			}

			.weather-icon:hover {
				transform: scale(1.03);
			}

			.weather-detail {
				background: rgba(31, 41, 55, 0.4);
				border-radius: 0.75rem;
				padding: 0.75rem;
				text-align: center;
				backdrop-filter: blur(3px);
				transition: all 0.2s ease;
			}

			.weather-detail:hover {
				transform: translateY(-1px);
				box-shadow: 0 3px 10px rgba(59, 130, 246, 0.1);
			}

			.weather-detail-icon {
				color: #60a5fa;
				margin-bottom: 0.25rem;
				font-size: 1.25rem;
			}

			.weather-detail-label {
				font-size: 0.75rem;
				color: #9ca3af;
				margin-bottom: 0.25rem;
			}

			.weather-detail-value {
				font-size: 1rem;
				font-weight: 500;
				color: white;
			}

			.weather-detail-unit {
				font-size: 0.75rem;
				color: #9ca3af;
				margin-left: 0.25rem;
			}

			.hourly-forecast-item {
				background: rgba(31, 41, 55, 0.4);
				border: 1px solid rgba(59, 130, 246, 0.1);
				border-radius: 0.75rem;
				padding: 0.75rem;
				transition: all 0.2s ease;
				backdrop-filter: blur(3px);
				width: 150px;
			}

			.hourly-forecast-item:hover {
				transform: translateY(-1px);
				box-shadow: 0 3px 10px rgba(59, 130, 246, 0.1);
				background: rgba(55, 65, 81, 0.6);
			}

			.error-message {
				background: rgba(239, 68, 68, 0.1);
				border-left: 2px solid #ef4444;
				padding: 0.75rem 1rem;
				border-radius: 0.5rem;
				color: #fecaca;
				margin: 0.75rem 0;
				font-size: 0.875rem;
				display: none;
				backdrop-filter: blur(3px);
			}

			#hourly-forecast .weather-detail {
				background: rgba(31, 41, 55, 0.5);
				border-radius: 0.75rem;
				padding: 0.75rem;
				text-align: center;
				transition: all 0.2s ease;
				border: 1px solid rgba(59, 130, 246, 0.1);
			}

			#hourly-forecast .weather-icon {
				width: 2.5rem;
				height: 2.5rem;
				margin: 0.25rem 0;
			}

			@keyframes slideIn {
				from {
					transform: translateY(15px);
					opacity: 0;
				}
				to {
					transform: translateY(0);
					opacity: 1;
				}
			}
		</style>
		<script src="js/tab-navigation.js"></script>
	</head>
	<body>
		<div class="container">
			<div class="weather-container">
				<!-- Tab Navigation -->
				<div id="tabNavigation" class="mb-2"></div>
				<script>
					document.getElementById("tabNavigation").innerHTML = createTabNavigation("weather");
				</script>

				<!-- City Selector -->
				<div class="flex flex-wrap justify-center gap-2 mb-2">
					<div id="citySelector" class="flex flex-wrap justify-center gap-1"></div>
				</div>

				<!-- Weather Content -->
				<div class="weather-card">
					<!-- Tab Buttons -->
					<div class="flex justify-center gap-2 mb-2">
						<button onclick="switchTab('current')" data-tab="current" class="tab-button active">
							<span class="material-icons text-xs">today</span>
							Hiện tại
						</button>
						<button onclick="switchTab('hourly')" data-tab="hourly" class="tab-button inactive">
							<span class="material-icons text-xs">schedule</span>
							Theo giờ
						</button>
					</div>

					<!-- Loading Indicator -->
					<div id="loading" class="text-center py-4 hidden">
						<div class="inline-flex items-center justify-center space-x-2">
							<div class="w-2 h-2 rounded-full bg-blue-400 animate-bounce" style="animation-delay: 0s"></div>
							<div class="w-2 h-2 rounded-full bg-blue-400 animate-bounce" style="animation-delay: 0.2s"></div>
							<div class="w-2 h-2 rounded-full bg-blue-400 animate-bounce" style="animation-delay: 0.4s"></div>
						</div>
						<p class="mt-2 text-gray-400 text-xs">Đang tải dữ liệu...</p>
					</div>

					<!-- Error Message -->
					<div id="error-message" class="error-message hidden text-xs p-2 mb-2"></div>

					<!-- Weather Info -->
					<div id="current-weather" class="flex-1 overflow-auto"></div>
					<div id="hourly-forecast" class="hidden flex-1 overflow-auto"></div>
				</div>
			</div>
		</div>

		<script>
			const apiKey = "979e7e4e95bc0ce656178e6a32d61218";
			const cities = [
				{ name: "Nhà Bè", lat: 10.6667, lon: 106.6833 },
				{ name: "Long Khánh", lat: 11.0167, lon: 107.15 },
			];

			let currentTab = "current";
			let selectedCity = cities[0];

			async function getWeatherData(city, forecast = false) {
				try {
					let url = `https://api.openweathermap.org/data/2.5/`;
					if (forecast) {
						url += `forecast?lat=${city.lat}&lon=${city.lon}&appid=${apiKey}&units=metric&lang=vi&cnt=8`;
					} else {
						url += `weather?lat=${city.lat}&lon=${city.lon}&appid=${apiKey}&units=metric&lang=vi`;
					}

					const response = await fetch(url);
					const data = await response.json();

					if (!response.ok) {
						throw new Error(data.message || "Lỗi không xác định từ API");
					}

					return data;
				} catch (error) {
					console.error("Lỗi khi lấy dữ liệu thời tiết:", error);
					throw error;
				}
			}

			function updateCurrentWeather(city, weatherData) {
				const container = document.getElementById("current-weather");
				if (!container || !weatherData) return;

				container.innerHTML = `
					<div class="weather-card p-4 sm:p-6">
						<div class="flex flex-col sm:flex-row items-center justify-between mb-4 gap-4">
							<div class="flex items-center gap-2 sm:gap-4 w-full sm:w-auto justify-between sm:justify-start">
								<img src="http://openweathermap.org/img/wn/${weatherData.weather[0].icon}@4x.png" 
									alt="${weatherData.weather[0].description}" 
									class="weather-icon w-16 h-16 sm:w-20 sm:h-20">
								<div class="text-center sm:text-left">
									<p class="text-2xl sm:text-3xl font-bold text-white">${Math.round(weatherData.main.temp)}<span class="text-lg sm:text-xl text-gray-300">°C</span></p>
									<p class="text-xs sm:text-sm text-gray-300 capitalize">${weatherData.weather[0].description}</p>
									<p class="text-gray-400 text-xs">Cảm giác: ${Math.round(weatherData.main.feels_like)}°C</p>
								</div>
							</div>
						</div>
						<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs sm:text-sm">
							<div class="weather-detail p-2">
								<div class="weather-detail-icon">
									<span class="material-icons text-base sm:text-lg">air</span>
								</div>
								<p class="weather-detail-label truncate">Tốc độ gió</p>
								<p class="weather-detail-value">${weatherData.wind.speed} <span class="weather-detail-unit">m/s</span></p>
							</div>
							<div class="weather-detail p-2">
								<div class="weather-detail-icon">
									<span class="material-icons text-base sm:text-lg">water_drop</span>
								</div>
								<p class="weather-detail-label truncate">Độ ẩm</p>
								<p class="weather-detail-value">${weatherData.main.humidity}<span class="weather-detail-unit">%</span></p>
							</div>
							<div class="weather-detail p-2">
								<div class="weather-detail-icon">
									<span class="material-icons text-base sm:text-lg">speed</span>
								</div>
								<p class="weather-detail-label truncate">Áp suất</p>
								<p class="weather-detail-value">${weatherData.main.pressure} <span class="weather-detail-unit">hPa</span></p>
							</div>
							<div class="weather-detail p-2">
								<div class="weather-detail-icon">
									<span class="material-icons text-base sm:text-lg">visibility</span>
								</div>
								<p class="weather-detail-label truncate">Tầm nhìn</p>
								<p class="weather-detail-value">${(weatherData.visibility / 1000).toFixed(1)} <span class="weather-detail-unit">km</span></p>
							</div>
						</div>
					</div>`;
			}

			function updateHourlyForecast(city, forecastData) {
				const container = document.getElementById("hourly-forecast");
				if (!container || !forecastData || !forecastData.list) return;

				// Chỉ lấy 4 khung giờ đầu tiên
				const hourlyData = forecastData.list.slice(0, 4);

				container.innerHTML = `
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs sm:text-sm">
            ${hourlyData
				.map((hour, index) => {
					const time = new Date(hour.dt * 1000);
					const temp = Math.round(hour.main.temp);
					const icon = hour.weather[0].icon;
					const description = hour.weather[0].description;

					return `
                    <div class="weather-detail flex flex-col items-center p-3">
                        <span class="text-sm font-medium text-gray-300">
                            ${index === 0 ? "Bây giờ" : time.getHours() + "h"}
                        </span>
                        <img src="https://openweathermap.org/img/wn/${icon}@2x.png" 
                             alt="${description}" 
                             class="weather-icon w-12 h-12">
                        <span class="text-lg font-bold text-white">${temp}°C</span>
                        <span class="text-xs text-gray-400 text-center">${description}</span>
                    </div>
                `;
				})
				.join("")}
        </div>
    `;
			}

			async function updateWeather() {
				const loading = document.getElementById("loading");
				const errorElement = document.getElementById("error-message");

				try {
					errorElement.style.display = "none";
					loading.classList.remove("hidden");

					if (currentTab === "current") {
						const weatherData = await getWeatherData(selectedCity);
						if (weatherData && weatherData.cod === 200) {
							updateCurrentWeather(selectedCity, weatherData);
							document.getElementById("current-weather").classList.remove("hidden");
							document.getElementById("hourly-forecast").classList.add("hidden");
						} else {
							throw new Error("Không thể tải dữ liệu thời tiết hiện tại");
						}
					} else {
						const forecastData = await getWeatherData(selectedCity, true);
						if (forecastData && forecastData.cod === "200") {
							updateHourlyForecast(selectedCity, forecastData);
							document.getElementById("current-weather").classList.add("hidden");
							document.getElementById("hourly-forecast").classList.remove("hidden");
						} else {
							throw new Error("Không thể tải dự báo thời tiết");
						}
					}
				} catch (error) {
					console.error("Lỗi khi cập nhật thời tiết:", error);
					errorElement.textContent = `Lỗi: ${error.message}. Vui lòng thử lại sau.`;
					errorElement.classList.remove("hidden");
				} finally {
					loading.classList.add("hidden");
				}
			}

			function switchTab(tab) {
				currentTab = tab;
				document.querySelectorAll(".tab-button").forEach((btn) => {
					if (btn.dataset.tab === tab) {
						btn.classList.add("active");
						btn.classList.remove("inactive");
					} else {
						btn.classList.add("inactive");
						btn.classList.remove("active");
					}
				});

				document.getElementById("error-message").classList.add("hidden");
				updateWeather();
			}

			function selectCity(cityName) {
				const city = cities.find((c) => c.name === cityName);
				if (city) {
					selectedCity = city;
					document.querySelectorAll(".city-btn").forEach((btn) => {
						if (btn.textContent === cityName) {
							btn.classList.add("active");
							btn.classList.remove("inactive");
						} else {
							btn.classList.remove("active");
							btn.classList.add("inactive");
						}
					});
					document.getElementById("error-message").classList.add("hidden");
					updateWeather();
				}
			}

			document.addEventListener("DOMContentLoaded", () => {
				// Thêm các nút thành phố
				const cityContainer = document.getElementById("citySelector");
				cities.forEach((city, index) => {
					const button = document.createElement("button");
					button.className = `city-btn ${index === 0 ? "active" : "inactive"}`;
					button.textContent = city.name;
					button.onclick = () => selectCity(city.name);
					cityContainer.appendChild(button);
				});

				// Khởi tạo tab mặc định
				switchTab("current");
			});

			// Cập nhật dữ liệu mỗi 5 phút
			setInterval(updateWeather, 5 * 60 * 1000);
		</script>
	</body>
</html>
