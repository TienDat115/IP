<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Quản Lý Phòng - Quản Lý Phòng Trọ</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
		<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
		<link href="style.css" rel="stylesheet" />
	</head>
	<body>
		<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
			<div class="container">
				<a class="navbar-brand" href="index.html"> <i class="fas fa-home"></i> Quản Lý Phòng Trọ </a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarNav">
					<ul class="navbar-nav ms-auto">
						<li class="nav-item">
							<a class="nav-link" href="index.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
						</li>
						<li class="nav-item">
							<a class="nav-link active" href="rooms.html"><i class="fas fa-door-open"></i> Phòng</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="tenants.html"><i class="fas fa-users"></i> Khách Thuê</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="utilities.html"><i class="fas fa-bolt"></i> Điện Nước</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="bills.html"><i class="fas fa-file-invoice"></i> Hóa Đơn</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="payments.html"><i class="fas fa-money-bill-wave"></i> Thanh Toán</a>
						</li>
					</ul>
				</div>
			</div>
		</nav>

		<div class="container mt-4">
			<div class="d-flex justify-content-between align-items-center mb-4">
				<h2><i class="fas fa-door-open"></i> Quản Lý Phòng</h2>
				<button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addRoomModal"><i class="fas fa-plus"></i> Thêm Phòng Mới</button>
			</div>

			<div class="row mb-3">
				<div class="col-md-6">
					<div class="input-group">
						<span class="input-group-text"><i class="fas fa-search"></i></span>
						<input type="text" class="form-control" id="searchRoom" placeholder="Tìm kiếm phòng..." />
					</div>
				</div>
				<div class="col-md-3">
					<select class="form-select" id="filterStatus">
						<option value="">Tất cả trạng thái</option>
						<option value="available">Trống</option>
						<option value="occupied">Đang thuê</option>
						<option value="maintenance">Bảo trì</option>
					</select>
				</div>
				<div class="col-md-3">
					<select class="form-select" id="sortBy">
						<option value="number">Sắp xếp theo số phòng</option>
						<option value="price">Sắp xếp theo giá</option>
						<option value="status">Sắp xếp theo trạng thái</option>
					</select>
				</div>
			</div>

			<div class="row" id="roomsList"></div>
		</div>

		<!-- Modal Thêm Phòng -->
		<div class="modal fade" id="addRoomModal" tabindex="-1">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Thêm Phòng Mới</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body">
						<form id="addRoomForm">
							<div class="mb-3">
								<label class="form-label">Số phòng</label>
								<input type="text" class="form-control" id="roomNumber" required />
							</div>
							<div class="mb-3">
								<label class="form-label">Giá thuê (VNĐ/tháng)</label>
								<input type="number" class="form-control" id="roomPrice" required />
							</div>
							<div class="mb-3">
								<label class="form-label">Diện tích (m²)</label>
								<input type="number" class="form-control" id="roomArea" required />
							</div>
							<div class="mb-3">
								<label class="form-label">Loại phòng</label>
								<select class="form-select" id="roomType">
									<option value="single">Phòng đơn</option>
									<option value="double">Phòng đôi</option>
									<option value="deluxe">Phòng cao cấp</option>
								</select>
							</div>
							<div class="mb-3">
								<label class="form-label">Mô tả</label>
								<textarea class="form-control" id="roomDescription" rows="3"></textarea>
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
						<button type="button" class="btn btn-primary" onclick="addRoom()">Thêm Phòng</button>
					</div>
				</div>
			</div>
		</div>

		<!-- Modal Chỉnh Sửa Phòng -->
		<div class="modal fade" id="editRoomModal" tabindex="-1">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Chỉnh Sửa Phòng</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body">
						<form id="editRoomForm">
							<input type="hidden" id="editRoomId" />
							<div class="mb-3">
								<label class="form-label">Số phòng</label>
								<input type="text" class="form-control" id="editRoomNumber" required />
							</div>
							<div class="mb-3">
								<label class="form-label">Giá thuê (VNĐ/tháng)</label>
								<input type="number" class="form-control" id="editRoomPrice" required />
							</div>
							<div class="mb-3">
								<label class="form-label">Diện tích (m²)</label>
								<input type="number" class="form-control" id="editRoomArea" required />
							</div>
							<div class="mb-3">
								<label class="form-label">Loại phòng</label>
								<select class="form-select" id="editRoomType">
									<option value="single">Phòng đơn</option>
									<option value="double">Phòng đôi</option>
									<option value="deluxe">Phòng cao cấp</option>
								</select>
							</div>
							<div class="mb-3">
								<label class="form-label">Trạng thái</label>
								<select class="form-select" id="editRoomStatus">
									<option value="available">Trống</option>
									<option value="occupied">Đang thuê</option>
									<option value="maintenance">Bảo trì</option>
								</select>
							</div>
							<div class="mb-3">
								<label class="form-label">Mô tả</label>
								<textarea class="form-control" id="editRoomDescription" rows="3"></textarea>
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
						<button type="button" class="btn btn-primary" onclick="updateRoom()">Cập Nhật</button>
					</div>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
		<script src="script.js"></script>
	</body>
</html>
