<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<!-- Thẻ favicon cơ bản (đã có) -->
		<link rel="icon" type="image/x-icon" href="https://images.macrumors.com/t/MKlRm9rIBpfcGnjTpf6ZxgpFTUg=/1600x1200/smart/article-new/2018/05/apple-music-note.jpg" />

		<!-- Thêm các thẻ sau cho Android -->
		<link rel="manifest" href="site.webmanifest" />
		<link rel="apple-touch-icon" sizes="192x192" href="https://images.macrumors.com/t/MKlRm9rIBpfcGnjTpf6ZxgpFTUg=/1600x1200/smart/article-new/2018/05/apple-music-note.jpg" />
		<meta name="theme-color" content="#000000" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lofi Music</title>
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
		<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
		<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
		<link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet" />
		<!-- Firebase Compatibility SDKs -->
		<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
		<!-- Firebase configuration -->
		<script src="../js/firebase-config.js"></script>
		<style>
			/* Spotify Color Palette */
			:root {
				--spotify-black: #191414;
				--spotify-green: #1db954;
				--spotify-green-hover: #1ed760;
				--spotify-gray: #282828;
				--spotify-gray-light: #3e3e3e;
				--spotify-gray-lighter: #535353;
				--spotify-white: #ffffff;
				--spotify-gray-text: #b3b3b3;
			}

			/* Global Styles */
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				background-color: var(--spotify-black);
				color: var(--spotify-white);
				font-family:
					"Circular",
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					Roboto,
					Oxygen,
					Ubuntu,
					Cantarell,
					sans-serif;
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				min-height: 100vh;
			}

			/* Main Layout */
			.spotify-container {
				display: grid;
				grid-template-rows: 1fr 90px;
				min-height: 100vh;
			}

			.main-content {
				display: grid;
				grid-template-columns: 240px 1fr;
				min-height: 0;
				overflow: hidden;
			}

			/* Sidebar Styles */
			.sidebar {
				background-color: var(--spotify-black);
				padding: 24px 16px;
				border-right: 1px solid var(--spotify-gray);
				overflow-y: auto;
			}

			.sidebar-section {
				margin-bottom: 24px;
			}

			.sidebar-logo {
				font-size: 24px;
				font-weight: 900;
				color: var(--spotify-white);
				margin-bottom: 24px;
				display: flex;
				align-items: center;
				gap: 8px;
			}

			.sidebar-nav {
				list-style: none;
			}

			.sidebar-nav li {
				margin-bottom: 8px;
			}

			.sidebar-nav a {
				color: var(--spotify-gray-text);
				text-decoration: none;
				font-size: 14px;
				font-weight: 600;
				padding: 10px 12px;
				border-radius: 4px;
				display: flex;
				align-items: center;
				gap: 16px;
				transition: all 0.2s ease;
			}

			.sidebar-nav a:hover {
				color: var(--spotify-white);
				background-color: var(--spotify-gray-light);
			}

			.sidebar-nav a.active {
				color: var(--spotify-white);
				background-color: var(--spotify-gray-light);
			}

			/* Content Area */
			.content-area {
				background: linear-gradient(to bottom, #1e1e1e 0%, var(--spotify-black) 100%);
				padding: 16px;
				overflow-y: auto;
				overflow-x: hidden;
				height: 100%;
			}

			/* Custom Scrollbar */
			.content-area::-webkit-scrollbar {
				width: 12px;
			}

			.content-area::-webkit-scrollbar-track {
				background: var(--spotify-gray);
				border-radius: 6px;
			}

			.content-area::-webkit-scrollbar-thumb {
				background: var(--spotify-gray-light);
				border-radius: 6px;
				border: 2px solid var(--spotify-gray);
			}

			.content-area::-webkit-scrollbar-thumb:hover {
				background: var(--spotify-gray-lighter);
			}

			.content-area::-webkit-scrollbar-thumb:active {
				background: var(--spotify-green);
			}

			/* Firefox */
			.content-area * {
				scrollbar-width: thin;
				scrollbar-color: var(--spotify-gray) var(--spotify-gray-light);
			}

			.content-area *::-webkit-scrollbar {
				scrollbar-width: thin;
			}

			/* Progress Bar */
			.progress-container {
				display: flex;
				align-items: center;
				gap: 8px;
			}

			.progress-time {
				color: var(--spotify-gray-text);
				font-size: 11px;
				min-width: 40px;
			}

			.progress-bar {
				flex: 1;
				height: 4px;
				background-color: var(--spotify-gray-light);
				border-radius: 2px;
				position: relative;
				cursor: pointer;
			}

			.progress-bar:hover .progress-hover {
				height: 8px;
				top: -2px;
			}

			-progress-hover {
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				bottom: 0;
				background-color: var(--spotify-gray-light);
				border-radius: 2px;
				transition:
					height 0.2s ease,
					top 0.2s ease;
			}

			.progress-fill {
				height: 100%;
				background-color: var(--spotify-white);
				border-radius: 2px;
				width: 0%;
				transition: width 0.1s linear;
				position: relative;
			}

			.progress-bar:hover .progress-fill {
				background-color: var(--spotify-green);
			}

			/* Player Bar */
			.player-bar {
				background-color: var(--spotify-gray);
				border-top: 1px solid var(--spotify-gray-light);
				padding: 16px;
				display: grid;
				grid-template-columns: 1fr 2fr 1fr;
				align-items: center;
				gap: 16px;
			}

			.player-center {
				display: flex;
				flex-direction: column;
				gap: 4px;
			}

			/* Player Controls */
			.player-controls {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 16px;
			}

			.player-btn {
				background: none;
				border: none;
				color: var(--spotify-gray-text);
				cursor: pointer;
				padding: 8px;
				border-radius: 50%;
				transition: all 0.2s ease;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.player-btn:hover {
				color: var(--spotify-white);
				background-color: var(--spotify-gray-light);
			}

			.player-btn.play-btn {
				background-color: var(--spotify-white);
				color: var(--spotify-black);
				width: 32px;
				height: 32px;
			}

			.player-btn .material-icons {
				font-size: 20px;
				display: block;
				line-height: 1;
			}

			.player-btn.play-btn:hover {
				background-color: var(--spotify-green-hover);
				transform: scale(1.05);
			}

			/* Track Info */
			.track-info {
				display: flex;
				align-items: center;
				gap: 12px;
			}

			.track-art {
				width: 56px;
				height: 56px;
				background-color: var(--spotify-gray-light);
				border-radius: 4px;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 24px;
			}

			.track-details {
				flex: 1;
			}

			.track-name {
				color: var(--spotify-white);
				font-size: 14px;
				font-weight: 400;
				margin-bottom: 4px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				max-width: 300px;
			}

			.track-artist {
				color: var(--spotify-gray-text);
				font-size: 11px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				max-width: 300px;
			}

			/* Volume Control */
			.volume-control {
				display: flex;
				align-items: center;
				justify-content: flex-end;
				gap: 8px;
				min-width: 0;
				flex-shrink: 0;
			}

			.volume-slider {
				width: 100px;
				height: 4px;
				background-color: var(--spotify-gray-light);
				border-radius: 2px;
				outline: none;
				-webkit-appearance: none;
				-moz-appearance: none;
				appearance: none;
				flex-shrink: 0;
				min-width: 0;
			}

			.volume-slider::-webkit-slider-thumb {
				-webkit-appearance: none;
				width: 12px;
				height: 12px;
				background-color: var(--spotify-white);
				border-radius: 50%;
				cursor: pointer;
				flex-shrink: 0;
			}

			.volume-slider::-moz-range-thumb {
				width: 12px;
				height: 12px;
				background-color: var(--spotify-white);
				border-radius: 50%;
				cursor: pointer;
				border: none;
				flex-shrink: 0;
			}

			.volume-slider::-webkit-slider-thumb:hover {
				background-color: var(--spotify-green);
				transform: scale(1.1);
			}

			.volume-slider::-moz-range-thumb:hover {
				background-color: var(--spotify-green);
				transform: scale(1.1);
			}

			/* Playlist Section */
			.playlist-section {
				margin-bottom: 20px;
			}

			.section-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 12px;
			}

			.section-title {
				font-size: 24px;
				font-weight: 700;
				color: var(--spotify-white);
			}

			.category-select {
				background-color: var(--spotify-gray-light);
				color: var(--spotify-white);
				border: 1px solid var(--spotify-gray-lighter);
				padding: 8px 12px;
				border-radius: 4px;
				font-size: 14px;
				cursor: pointer;
			}

			.playlist-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
				gap: 24px;
			}

			.playlist-item {
				background-color: var(--spotify-gray-light);
				border-radius: 8px;
				padding: 16px;
				cursor: pointer;
				transition: all 0.3s ease;
				position: relative;
			}

			.playlist-item:hover {
				background-color: var(--spotify-gray-lighter);
			}

			.playlist-item:hover .play-overlay {
				opacity: 1;
				transform: translateY(0);
			}

			.play-overlay {
				position: absolute;
				bottom: 16px;
				right: 16px;
				background-color: var(--spotify-green);
				width: 48px;
				height: 48px;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				opacity: 0;
				transform: translateY(8px);
				transition: all 0.3s ease;
				box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
			}

			.play-overlay:hover {
				background-color: var(--spotify-green-hover);
				transform: scale(1.05);
			}

			.playlist-cover {
				width: 100%;
				height: 180px;
				background-color: var(--spotify-gray);
				border-radius: 4px;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 48px;
				margin-bottom: 12px;
			}

			.playlist-title {
				color: var(--spotify-white);
				font-size: 14px;
				font-weight: 600;
				margin-bottom: 4px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.playlist-description {
				color: var(--spotify-gray-text);
				font-size: 12px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			/* Song List */
			.song-list {
				background-color: var(--spotify-gray-light);
				border-radius: 8px;
				padding: 12px;
			}

			.song-item {
				display: grid;
				grid-template-columns: 16px 1fr 100px 60px;
				align-items: center;
				padding: 8px;
				border-radius: 4px;
				transition: all 0.2s ease;
				gap: 16px;
			}

			.song-item:hover {
				background-color: var(--spotify-gray-lighter);
			}

			.song-item.playing {
				color: var(--spotify-green);
				background-color: rgba(30, 215, 96, 0.1);
				border-left: 3px solid var(--spotify-green);
			}

			.song-item.playing .song-number::before {
				content: "🎵";
				font-size: 12px;
				animation: pulse 1.5s infinite;
			}

			.song-item.playing .song-number {
				color: var(--spotify-green);
				font-weight: 600;
			}

			@keyframes pulse {
				0%,
				100% {
					opacity: 1;
					transform: scale(1);
				}
				50% {
					opacity: 0.7;
					transform: scale(1.1);
				}
			}

			.song-number {
				color: var(--spotify-gray-text);
				font-size: 14px;
				text-align: center;
			}

			.song-info {
				display: flex;
				align-items: center;
				gap: 12px;
			}

			.song-icon {
				font-size: 20px;
			}

			.song-title {
				color: var(--spotify-white);
				font-size: 14px;
				font-weight: 400;
			}

			.song-duration {
				color: var(--spotify-gray-text);
				font-size: 14px;
				text-align: right;
			}

			.favorite-btn {
				background: none;
				border: none;
				color: var(--spotify-gray-text);
				cursor: pointer;
				font-size: 18px;
				padding: 4px;
				transition: all 0.2s ease;
			}

			.favorite-btn:hover {
				color: var(--spotify-white);
				transform: scale(1.1);
			}

			.favorite-btn.active {
				color: #ff6b6b;
			}

			/* Pagination */
			.pagination {
				display: flex;
				justify-content: center;
				align-items: center;
				gap: 8px;
				margin-top: 24px;
			}

			.pagination button {
				background-color: var(--spotify-gray-light);
				color: var(--spotify-white);
				border: none;
				padding: 8px 12px;
				border-radius: 4px;
				cursor: pointer;
				font-size: 14px;
				transition: all 0.2s ease;
			}

			.pagination button:hover:not(:disabled) {
				background-color: var(--spotify-gray-lighter);
			}

			.pagination button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}

			.pagination button.active {
				background-color: var(--spotify-green);
			}

			/* Control Buttons */
			.control-buttons {
				display: flex;
				gap: 8px;
				margin-bottom: 16px;
			}

			.control-btn {
				background-color: var(--spotify-gray-light);
				color: var(--spotify-white);
				border: none;
				padding: 8px 16px;
				border-radius: 20px;
				cursor: pointer;
				font-size: 14px;
				font-weight: 600;
				transition: all 0.2s ease;
				display: flex;
				align-items: center;
				gap: 8px;
			}

			.control-btn:hover {
				background-color: var(--spotify-gray-lighter);
				transform: translateY(-1px);
			}

			.control-btn.active {
				background-color: var(--spotify-green);
				color: var(--spotify-black);
				box-shadow: 0 2px 8px rgba(30, 215, 96, 0.3);
				transform: translateY(-1px);
			}

			/* Responsive Design */
			@media (max-width: 1024px) {
				.main-content {
					grid-template-columns: 200px 1fr;
				}

				.sidebar {
					padding: 16px 12px;
				}

				.sidebar-logo {
					font-size: 20px;
				}

				.content-area {
					padding: 16px;
				}
			}

			@media (max-width: 768px) {
				.main-content {
					grid-template-columns: 1fr;
				}

				.sidebar {
					display: none;
				}

				.player-bar {
					grid-template-columns: 1fr auto;
					gap: 12px;
					padding: 12px 16px;
					height: auto;
					min-height: 90px;
				}

				.track-info {
					flex: 1;
					min-width: 0;
				}

				.player-center {
					gap: 8px;
					flex: 1;
					display: flex;
					flex-direction: column;
				}

				.progress-container {
					order: -1;
					margin-bottom: 8px;
					width: 100%;
				}

				.progress-time {
					font-size: 10px;
					min-width: 35px;
				}

				.player-controls {
					justify-content: center;
					gap: 12px;
					display: flex;
					align-items: center;
					flex-wrap: wrap;
				}

				.volume-control {
					justify-content: flex-end;
					align-items: center;
					gap: 8px;
					min-width: 120px;
					margin-left: auto;
				}

				.volume-slider {
					width: 60px;
				}

				.playlist-grid {
					grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
				}

				.song-item {
					grid-template-columns: 1fr 60px;
					padding: 8px;
				}

				.song-number {
					display: none;
				}

				.song-duration {
					display: none;
				}

				.song-icon {
					font-size: 16px;
				}

				.song-title {
					font-size: 13px;
				}

				.control-buttons {
					flex-wrap: wrap;
					gap: 6px;
					margin-bottom: 16px;
				}

				.control-btn {
					padding: 6px 12px;
					font-size: 12px;
				}

				.control-btn.active {
					background-color: var(--spotify-green);
					color: var(--spotify-black);
					box-shadow: 0 2px 6px rgba(30, 215, 96, 0.3);
				}

				.section-title {
					font-size: 20px;
				}

				.category-select {
					padding: 6px 10px;
					font-size: 12px;
				}
			}

			@media (max-width: 600px) {
				.player-bar {
					grid-template-columns: 1fr;
					gap: 10px;
					padding: 10px 12px;
				}

				.track-info {
					justify-content: center;
					text-align: center;
					margin-bottom: 8px;
				}

				.track-art {
					width: 36px;
					height: 36px;
					font-size: 16px;
				}

				.track-name {
					font-size: 11px;
					max-width: 200px;
				}

				.player-center {
					width: 100%;
				}

				.progress-container {
					margin-bottom: 6px;
				}

				.progress-time {
					font-size: 9px;
					min-width: 30px;
				}

				.player-controls {
					gap: 8px;
					margin-bottom: 8px;
					justify-content: center;
					align-items: center;
				}

				.volume-control {
					justify-content: center;
					min-width: auto;
					width: 100%;
					margin-left: 0;
					margin-top: 8px;
				}

				.volume-slider {
					width: 80px;
				}
			}

			@media (max-width: 480px) {
				.player-bar {
					padding: 8px;
					gap: 8px;
					min-height: 100px;
				}

				.track-info {
					gap: 6px;
				}

				.track-art {
					width: 32px;
					height: 32px;
					font-size: 14px;
				}

				.track-name {
					font-size: 10px;
					max-width: 150px;
				}

				.progress-container {
					gap: 4px;
				}

				.progress-time {
					font-size: 8px;
					min-width: 28px;
				}

				.player-btn {
					padding: 5px;
				}

				.player-btn.play-btn {
					width: 24px;
					height: 24px;
				}

				.player-btn .material-icons {
					font-size: 16px;
				}

				.volume-slider {
					width: 60px;
				}

				.volume-value {
					font-size: 9px;
					min-width: 30px;
				}

				.control-buttons {
					gap: 4px;
					margin-bottom: 12px;
				}

				.control-btn {
					padding: 4px 8px;
					font-size: 11px;
				}

				.control-btn span:last-child {
					display: none;
				}

				.section-header {
					flex-direction: column;
					gap: 12px;
					align-items: stretch;
				}

				.section-title {
					font-size: 18px;
					text-align: center;
				}

				.category-select {
					width: 100%;
				}

				.song-item {
					padding: 6px;
				}

				.song-title {
					font-size: 12px;
				}

				.pagination button {
					padding: 6px 10px;
					font-size: 12px;
				}
			}

			@media (max-width: 360px) {
				.player-bar {
					padding: 6px;
					gap: 6px;
					min-height: 110px;
				}

				.track-art {
					width: 28px;
					height: 28px;
					font-size: 12px;
				}

				.track-name {
					font-size: 9px;
					max-width: 120px;
				}

				.player-controls {
					gap: 6px;
				}

				.player-btn {
					padding: 4px;
				}

				.player-btn.play-btn {
					width: 20px;
					height: 20px;
				}

				.player-btn .material-icons {
					font-size: 14px;
				}

				.volume-slider {
					width: 50px;
				}

				.progress-time {
					font-size: 7px;
					min-width: 25px;
				}
			}

			/* Hide elements that will be replaced */
			.player-wrapper {
				display: none;
			}

			#playerContainer {
				display: none;
			}

			#currentSong {
				display: none;
			}

			#playlistWrapper {
				display: none;
			}
		</style>
	</head>
	<body>
		<div class="spotify-container">
			<div class="main-content">
				<!-- Sidebar -->
				<aside class="sidebar">
					<div class="sidebar-logo">
						<span>🎵</span>
						<span>Spotify</span>
					</div>
				</aside>

				<!-- Content Area -->
				<main class="content-area">
					<!-- Control Buttons -->
					<div class="control-buttons">
						<button onclick="toggleRandom()" class="control-btn" id="shuffleBtn">
							<span class="material-icons">shuffle</span>
							<span>Shuffle</span>
						</button>
						<button onclick="toggleRepeat()" class="control-btn" id="repeatBtn">
							<span class="material-icons">repeat</span>
							<span>Repeat</span>
						</button>
						<button onclick="toggleNoRepeat()" class="control-btn" id="noRepeatBtn">
							<span class="material-icons">repeat_one</span>
							<span>No Repeat</span>
						</button>
						<button onclick="playNext()" class="control-btn">
							<span class="material-icons">skip_next</span>
							<span>Next</span>
						</button>
					</div>

					<!-- Playlist Section -->
					<div class="playlist-section">
						<div class="section-header">
							<h2 class="section-title">Music Library</h2>
							<select id="categorySelect" class="category-select"></select>
						</div>

						<!-- Song List -->
						<div class="song-list" id="songList">
							<!-- Songs will be rendered here -->
						</div>

						<!-- Pagination -->
						<div class="pagination" id="pagination">
							<!-- Pagination will be rendered here -->
						</div>
					</div>

					<!-- Hidden audio player -->
					<div id="playerContainer" style="display: none"></div>
				</main>
			</div>

			<!-- Player Bar -->
			<div class="player-bar">
				<!-- Track Info -->
				<div class="track-info">
					<div class="track-art" id="trackArt">🎵</div>
					<div class="track-details">
						<div class="track-name" id="trackName">No track playing</div>
					</div>
				</div>

				<!-- Progress and Controls -->
				<div class="player-center">
					<!-- Progress Bar -->
					<div class="progress-container">
						<span class="progress-time" id="currentTime">0:00</span>
						<div class="progress-bar" id="progressBar">
							<div class="progress-hover"></div>
							<div class="progress-fill" id="progressFill"></div>
						</div>
						<span class="progress-time" id="totalTime">0:00</span>
					</div>

					<!-- Player Controls -->
					<div class="player-controls">
						<button class="player-btn" onclick="playPrevious()">
							<span class="material-icons">skip_previous</span>
						</button>
						<button class="player-btn play-btn" id="playPauseBtn" onclick="togglePlayPause()">
							<span class="material-icons">play_arrow</span>
						</button>
						<button class="player-btn" onclick="playNext()">
							<span class="material-icons">skip_next</span>
						</button>

						<!-- Volume Control -->
						<div class="volume-control">
							<button class="player-btn" id="muteBtn">
								<span class="material-icons">volume_up</span>
							</button>
							<input type="range" id="volumeSlider" min="0" max="100" value="50" class="volume-slider" />
							<span id="volumeValue" style="color: var(--spotify-gray-text); font-size: 12px; min-width: 40px">50%</span>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Hidden elements for backward compatibility -->
		<div id="currentSong" style="display: none"></div>
		<div id="playlistWrapper" style="display: none">
			<ul id="playlist" style="display: none"></ul>
		</div>

		<script>
			// Initialize Firebase
			firebase.initializeApp(firebaseConfig);
			const auth = firebase.auth();
			const db = firebase.firestore();

			// Kiểm tra đăng nhập
			auth.onAuthStateChanged((user) => {
				if (!user) {
					// Nếu chưa đăng nhập, chuyển hướng về trang đăng nhập
					window.location.href = "../login.html";
				} else {
					// Đã đăng nhập, tải danh sách yêu thích từ Firebase
					loadFavoritesFromFirebase(user.uid);
				}
			});

			// Hàm tải danh sách yêu thích từ Firebase
			async function loadFavoritesFromFirebase(userId) {
				try {
					const doc = await db.collection("userFavorites").doc(userId).get();
					if (doc.exists) {
						favorites = doc.data().favorites || [];
						localStorage.setItem("favorites", JSON.stringify(favorites));
					}
				} catch (error) {
					console.error("Lỗi khi tải danh sách yêu thích:", error);
				}
			}

			// Hàm lưu danh sách yêu thích lên Firebase
			async function saveFavoritesToFirebase(userId, favorites) {
				try {
					await db.collection("userFavorites").doc(userId).set(
						{
							favorites: favorites,
							lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
						},
						{ merge: true },
					);
				} catch (error) {
					console.error("Lỗi khi lưu danh sách yêu thích:", error);
				}
			}

			// Load playlists from JSON file
			fetch("js/playlists.json")
				.then((response) => response.json())
				.then((playlists) => {
					const MUSIC_FOLDER = "music/";

					// Tạo danh sách "Tất cả bài hát"
					const allSongs = [];
					Object.values(playlists).forEach((songs) => {
						if (Array.isArray(songs)) {
							songs.forEach((filename) => {
								const path = MUSIC_FOLDER + filename + ".mp3";
								allSongs.push({
									path: path,
									title: filename,
								});
							});
						}
					});
					playlists["Tất cả bài hát"] = allSongs;

					// Cập nhật danh sách yêu thích từ local storage
					let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
					favorites = Array.isArray(favorites) ? favorites : [];

					// Cập nhật danh sách yêu thích
					playlists["Danh Sách Yêu Thích"] = [];
					favorites.forEach((favoriteUrl) => {
						for (const [playlistName, songs] of Object.entries(playlists)) {
							if (playlistName === "Tất cả bài hát" || playlistName === "Danh Sách Yêu Thích") continue;

							// Chỉ lấy tên file để so sánh (bỏ đi thư mục và đuôi .mp3)
							const favoriteFilename = favoriteUrl.replace(MUSIC_FOLDER, "").replace(/\.mp3$/, "");
							const song = songs.find((songPath) => songPath === favoriteFilename);

							if (song) {
								playlists["Danh Sách Yêu Thích"].push({
									path: MUSIC_FOLDER + song + ".mp3",
									title: song,
								});
								break;
							}
						}
					});

					// Cập nhật select box
					const categorySelect = document.getElementById("categorySelect");
					categorySelect.innerHTML = "";
					Object.keys(playlists).forEach((playlistName) => {
						const option = document.createElement("option");
						option.value = playlistName;
						option.textContent = playlistName;
						categorySelect.appendChild(option);
					});

					let currentPlaylist = "Tất cả bài hát";
					let currentIndex = 0;
					let isRandom = true;
					let isNoRepeat = false;
					let currentPage = 1;
					const pageSize = 10;
					let playedSongs = new Set();

					const playerContainer = document.getElementById("playerContainer");
					const currentSongDisplay = document.getElementById("currentSong");
					const playlist = document.getElementById("playlist");
					const playlistWrapper = document.getElementById("playlistWrapper");

					// Progress bar elements
					const progressBar = document.getElementById("progressBar");
					const progressFill = document.getElementById("progressFill");
					const currentTimeEl = document.getElementById("currentTime");
					const totalTimeEl = document.getElementById("totalTime");

					// Volume control elements
					const volumeSlider = document.getElementById("volumeSlider");
					const volumeValue = document.getElementById("volumeValue");
					const muteBtn = document.getElementById("muteBtn");
					let isMuted = false;

					// Format time helper
					function formatTime(seconds) {
						if (isNaN(seconds)) return "0:00";
						const mins = Math.floor(seconds / 60);
						const secs = Math.floor(seconds % 60);
						return `${mins}:${secs.toString().padStart(2, "0")}`;
					}

					// Update progress bar
					function updateProgress() {
						const audio = document.getElementById("audioPlayer");
						if (audio && !isNaN(audio.duration)) {
							const progress = (audio.currentTime / audio.duration) * 100;
							progressFill.style.width = progress + "%";
							currentTimeEl.textContent = formatTime(audio.currentTime);
							totalTimeEl.textContent = formatTime(audio.duration);
						}
					}

					// Progress bar click to seek
					progressBar.addEventListener("click", function (e) {
						const audio = document.getElementById("audioPlayer");
						if (audio && !isNaN(audio.duration)) {
							const rect = progressBar.getBoundingClientRect();
							const percent = (e.clientX - rect.left) / rect.width;
							audio.currentTime = percent * audio.duration;
						}
					});

					categorySelect.addEventListener("change", function () {
						currentPlaylist = this.value;
						currentIndex = 0;
						currentPage = 1;
						renderPlaylist();
					});

					function renderPlaylist() {
						const songList = document.getElementById("songList");
						songList.innerHTML = "";
						const currentList = playlists[currentPlaylist];

						// Kiểm tra nếu là playlist đặc biệt (đã được xử lý sẵn)
						const isSpecialPlaylist = currentPlaylist === "Tất cả bài hát" || currentPlaylist === "Danh Sách Yêu Thích";

						const start = (currentPage - 1) * pageSize;
						const end = Math.min(start + pageSize, currentList.length);

						for (let idx = start; idx < end; idx++) {
							let song, url, title;

							if (isSpecialPlaylist) {
								// Đã có đầy đủ thông tin
								song = currentList[idx];
								url = song.path;
								title = song.title;
							} else {
								// Tạo đối tượng song từ tên file
								const filename = currentList[idx];
								url = MUSIC_FOLDER + filename + ".mp3";
								title = filename.replace(/\.mp3$/, "");
							}

							const isFavorite = favorites.some((fav) => fav === url);

							const songItem = document.createElement("div");
							songItem.className = "song-item" + (idx === currentIndex ? " playing" : "");

							// Song number
							const songNumber = document.createElement("div");
							songNumber.className = "song-number";
							songNumber.textContent = idx === currentIndex ? "🎵" : (idx + 1).toString();
							songItem.appendChild(songNumber);

							// Song info
							const songInfo = document.createElement("div");
							songInfo.className = "song-info";

							const songIcon = document.createElement("span");
							songIcon.className = "song-icon";
							songIcon.textContent = "🎵";

							const songTitle = document.createElement("div");
							songTitle.className = "song-title";
							songTitle.textContent = title;

							songInfo.appendChild(songIcon);
							songInfo.appendChild(songTitle);
							songItem.appendChild(songInfo);

							// Song duration
							const songDuration = document.createElement("div");
							songDuration.className = "song-duration";
							// Lấy duration từ audio metadata khi có thể
							const tempAudio = new Audio(url);
							tempAudio.addEventListener("loadedmetadata", function () {
								const minutes = Math.floor(tempAudio.duration / 60);
								const seconds = Math.floor(tempAudio.duration % 60);
								songDuration.textContent = `${minutes}:${seconds.toString().padStart(2, "0")}`;
							});
							tempAudio.addEventListener("error", function () {
								// Fallback nếu không load được metadata
								songDuration.textContent = "0:00";
							});
							songDuration.textContent = "Loading...";
							songItem.appendChild(songDuration);

							// Favorite button
							const favoriteBtn = document.createElement("button");
							favoriteBtn.className = "favorite-btn" + (isFavorite ? " active" : "");
							favoriteBtn.innerHTML = isFavorite ? "❤️" : "🤍";
							favoriteBtn.onclick = (event) => {
								event.stopPropagation();
								toggleFavorite(url);
							};
							songItem.appendChild(favoriteBtn);

							songItem.onclick = (event) => {
								if (event.target !== favoriteBtn) {
									currentIndex = idx;
									play(currentIndex);
									renderPlaylist();
								}
							};
							songList.appendChild(songItem);
						}
						renderPagination();
					}

					function renderPagination() {
						const pagination = document.getElementById("pagination");
						pagination.innerHTML = "";
						const totalPages = Math.ceil(playlists[currentPlaylist].length / pageSize);
						const isMobile = window.innerWidth <= 360; // 360px là breakpoint cho mobile nhỏ
						const maxVisiblePages = isMobile ? 3 : 5; // 3 cho mobile nhỏ, 5 cho desktop
						let startPage, endPage;

						// Tính toán trang bắt đầu và kết thúc để hiển thị
						if (totalPages <= maxVisiblePages) {
							startPage = 1;
							endPage = totalPages;
						} else {
							// Tính toán để trang hiện tại luôn nằm giữa
							const maxPagesBeforeCurrent = Math.floor(maxVisiblePages / 2);
							const maxPagesAfterCurrent = Math.ceil(maxVisiblePages / 2) - 1;

							if (currentPage <= maxPagesBeforeCurrent) {
								// Trang hiện tại gần đầu
								startPage = 1;
								endPage = maxVisiblePages;
							} else if (currentPage + maxPagesAfterCurrent >= totalPages) {
								// Trang hiện tại gần cuối
								startPage = totalPages - maxVisiblePages + 1;
								endPage = totalPages;
							} else {
								// Trang hiện tại ở giữa
								startPage = currentPage - maxPagesBeforeCurrent;
								endPage = currentPage + maxPagesAfterCurrent;
							}
						}

						// Nút Previous
						const prevBtn = document.createElement("button");
						prevBtn.textContent = "";
						prevBtn.disabled = currentPage === 1;
						prevBtn.onclick = () => {
							if (currentPage > 1) {
								currentPage--;
								renderPlaylist();
							}
						};
						pagination.appendChild(prevBtn);

						// Nút trang đầu tiên
						if (startPage > 1) {
							const firstPageBtn = document.createElement("button");
							firstPageBtn.textContent = "1";
							firstPageBtn.onclick = () => {
								currentPage = 1;
								renderPlaylist();
							};
							pagination.appendChild(firstPageBtn);

							// Thêm dấu "..." nếu cần
							if (startPage > 2) {
								const ellipsis = document.createElement("span");
								ellipsis.textContent = "...";
								ellipsis.style.color = "var(--spotify-gray-text)";
								pagination.appendChild(ellipsis);
							}
						}

						// Các nút trang
						for (let i = startPage; i <= endPage; i++) {
							const pageBtn = document.createElement("button");
							pageBtn.textContent = i;
							if (i === currentPage) {
								pageBtn.className = "active";
							}
							pageBtn.onclick = () => {
								currentPage = i;
								renderPlaylist();
							};
							pagination.appendChild(pageBtn);
						}

						// Nút trang cuối cùng
						if (endPage < totalPages) {
							// Thêm dấu "..." nếu cần
							if (endPage < totalPages - 1) {
								const ellipsis = document.createElement("span");
								ellipsis.textContent = "...";
								ellipsis.style.color = "var(--spotify-gray-text)";
								pagination.appendChild(ellipsis);
							}

							const lastPageBtn = document.createElement("button");
							lastPageBtn.textContent = totalPages;
							lastPageBtn.onclick = () => {
								currentPage = totalPages;
								renderPlaylist();
							};
							pagination.appendChild(lastPageBtn);
						}

						// Nút Next
						const nextBtn = document.createElement("button");
						nextBtn.textContent = "";
						nextBtn.disabled = currentPage === totalPages;
						nextBtn.onclick = () => {
							if (currentPage < totalPages) {
								currentPage++;
								renderPlaylist();
							}
						};
						pagination.appendChild(nextBtn);
					}

					function play(index) {
						const currentList = playlists[currentPlaylist];
						const isSpecialPlaylist = currentPlaylist === "Tất cả bài hát" || currentPlaylist === "Danh Sách Yêu Thích";

						let songData, url, title;
						songData = currentList[index];

						// Nếu là playlist thông thường, tạo đối tượng song từ tên file
						if (!isSpecialPlaylist) {
							songData = {
								path: MUSIC_FOLDER + songData + ".mp3",
								title: typeof songData === "string" ? songData.replace(/\.mp3$/, "") : songData.title,
							};
						}

						let audio = document.getElementById("audioPlayer");

						// Tạo audio player nếu chưa tồn tại
						if (!audio) {
							audio = document.createElement("audio");
							audio.id = "audioPlayer";
							audio.controls = false; // ẩn controls vì chúng ta có custom player
							audio.volume = volumeSlider.value / 100;
							audio.addEventListener("ended", function () {
								if (isRepeat) play(currentIndex);
								else playNext();
							});
							audio.addEventListener("play", function () {
								updatePlayPauseButton(true);
							});
							audio.addEventListener("pause", function () {
								updatePlayPauseButton(false);
							});
							audio.addEventListener("timeupdate", updateProgress);
							audio.addEventListener("loadedmetadata", updateProgress);
							playerContainer.appendChild(audio);
						}

						// Cập nhật title của trang
						document.title = songData.title;

						// Cập nhật thông tin bài hát trên player bar
						const trackName = document.getElementById("trackName");
						const trackArt = document.getElementById("trackArt");

						if (trackName) {
							trackName.textContent = songData.title;
						}

						if (trackArt) {
							trackArt.textContent = "";
						}

						// Cập nhật player
						audio.src = songData.path;
						audio.play();
						if (isRandom) {
							playedSongs.add(songData.path);
						}

						// Cập nhật UI
						currentIndex = index;
						renderPlaylist();
					}

					let isRepeat = false;

					function toggleRepeat() {
						isRepeat = !isRepeat;
						const repeatBtn = document.getElementById("repeatBtn");
						if (repeatBtn) {
							if (isRepeat) {
								repeatBtn.classList.add("active");
							} else {
								repeatBtn.classList.remove("active");
							}
						}
						// Sử dụng Toastify thay vì Swal.fire
						Toastify({
							text: isRepeat ? "Đã bật lặp lại bài" : "Đã tắt lặp lại bài",
							duration: 2000,
							gravity: "top",
							position: "right",
							stopOnFocus: true,
							style: {
								background: isRepeat ? "var(--spotify-green)" : "var(--spotify-gray-light)",
								color: "var(--spotify-white)",
								borderRadius: "8px",
								padding: "10px 15px",
								boxShadow: "0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)",
							},
						}).showToast();
					}

					function playNext() {
						const currentList = playlists[currentPlaylist];
						if (isRandom) {
							let nextIndex;
							if (isNoRepeat) {
								// Lọc các bài hát chưa được phát
								const availableIndexes = Array.from({ length: currentList.length }, (_, i) => i).filter((idx) => !playedSongs.has(idx));

								if (availableIndexes.length === 0) {
									// Nếu tất cả bài hát đã được phát, reset set và lấy lại bài hát đầu tiên
									playedSongs.clear();
									nextIndex = 0;
								} else {
									// Chọn ngẫu nhiên từ các bài hát chưa được phát
									const randomPos = Math.floor(Math.random() * availableIndexes.length);
									nextIndex = availableIndexes[randomPos];
								}
								playedSongs.add(nextIndex);
							} else {
								// Nếu không bật "Không lặp lại", chọn ngẫu nhiên bất kỳ bài hát nào
								nextIndex = Math.floor(Math.random() * currentList.length);
							}
							currentIndex = nextIndex;
						} else {
							currentIndex = (currentIndex + 1) % currentList.length;
						}
						// Cập nhật currentPage dựa trên bài hát mới
						currentPage = Math.floor(currentIndex / pageSize) + 1;
						play(currentIndex);
						renderPagination();
					}

					function toggleNoRepeat() {
						isNoRepeat = !isNoRepeat;
						const noRepeatBtn = document.getElementById("noRepeatBtn");
						if (noRepeatBtn) {
							if (isNoRepeat) {
								playedSongs.clear();
								noRepeatBtn.classList.add("active");
							} else {
								playedSongs.clear();
								noRepeatBtn.classList.remove("active");
							}
						}
						// Sử dụng Toastify thay vì Swal.fire
						Toastify({
							text: isNoRepeat ? "Đã tắt phát lại" : "Đã bật phát lại",
							duration: 2000,
							gravity: "top",
							position: "right",
							stopOnFocus: true,
							style: {
								background: isNoRepeat ? "var(--spotify-green)" : "var(--spotify-gray-light)",
								color: "var(--spotify-white)",
								borderRadius: "8px",
								padding: "10px 15px",
								boxShadow: "0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)",
							},
						}).showToast();
					}

					function toggleRandom() {
						isRandom = !isRandom;
						const shuffleBtn = document.getElementById("shuffleBtn");
						if (shuffleBtn) {
							if (isRandom) {
								shuffleBtn.classList.add("active");
							} else {
								shuffleBtn.classList.remove("active");
							}
						}
						// Sử dụng Toastify thay vì Swal.fire
						Toastify({
							text: isRandom ? "Đã bật chế độ ngẫu nhiên" : "Đã tắt chế độ ngẫu nhiên",
							duration: 2000,
							gravity: "top",
							position: "right",
							stopOnFocus: true,
							style: {
								background: isRandom ? "var(--spotify-green)" : "var(--spotify-gray-light)",
								color: "var(--spotify-white)",
								borderRadius: "8px",
								padding: "10px 15px",
								boxShadow: "0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)",
							},
						}).showToast();
					}

					function toggleFavorite(url) {
						const user = auth.currentUser;
						if (!user) {
							window.location.href = "../login.html";
							return;
						}

						const isFavorite = favorites.includes(url);
						if (isFavorite) {
							favorites = favorites.filter((song) => song !== url);
							// Xóa bài hát khỏi danh sách yêu thích
							const index = playlists["Danh Sách Yêu Thích"].findIndex((song) => song.path === url);
							if (index !== -1) {
								playlists["Danh Sách Yêu Thích"].splice(index, 1);
							}
						} else {
							favorites.push(url);
							// Thêm bài hát vào danh sách yêu thích
							const currentList = playlists[currentPlaylist];
							const songIndex = currentList.findIndex((song) => song.path === url);
							if (songIndex !== -1) {
								playlists["Danh Sách Yêu Thích"].push(currentList[songIndex]);
							}
						}

						// Lưu vào localStorage
						localStorage.setItem("favorites", JSON.stringify(favorites));

						// Lưu lên Firebase
						saveFavoritesToFirebase(user.uid, favorites);

						renderPlaylist();
					}

					// Volume control event listeners
					if (volumeSlider && muteBtn) {
						// Xử lý sự kiện khi di chuyển thanh trượt
						volumeSlider.addEventListener("input", function () {
							const volume = this.value / 100;
							volumeValue.textContent = `${this.value}%`;

							// Hủy mute nếu đang mute
							if (isMuted) {
								isMuted = false;
								muteBtn.innerHTML = '<span class="material-icons">volume_up</span>';
							}

							// Update volume for all audio elements
							const audioElements = document.getElementsByTagName("audio");
							for (let audio of audioElements) {
								audio.volume = isMuted ? 0 : volume;
							}
						});

						// Xử lý sự kiện khi click nút mute
						muteBtn.onclick = function () {
							isMuted = !isMuted;
							const volume = volumeSlider.value / 100;

							// Update icon
							this.innerHTML = isMuted ? '<span class="material-icons">volume_off</span>' : '<span class="material-icons">volume_up</span>';

							// Update volume for all audio elements
							const audioElements = document.getElementsByTagName("audio");
							for (let audio of audioElements) {
								audio.volume = isMuted ? 0 : volume;
							}
						};

						// Set initial volume
						volumeSlider.value = 50;
						volumeValue.textContent = "50%";

						// Apply initial volume to all elements
						const audioElements = document.getElementsByTagName("audio");
						for (let audio of audioElements) {
							audio.volume = 0.5;
						}
					}

					// Thêm sự kiện lắng nghe phím
					document.addEventListener("keydown", function (event) {
						const volumeSlider = document.getElementById("volumeSlider");
						if (!volumeSlider) return;

						let currentVolume = parseInt(volumeSlider.value);
						const step = 1; // Bước nhảy âm lượng

						switch (event.key) {
							case "ArrowRight":
								event.preventDefault();
								currentVolume = Math.min(100, currentVolume + step);
								break;
							case "ArrowLeft":
								event.preventDefault();
								currentVolume = Math.max(0, currentVolume - step);
								break;
							case "m":
							case "M":
								event.preventDefault();
								const muteBtn = document.getElementById("muteBtn");
								if (muteBtn) muteBtn.click();
								return; // Không cần cập nhật thanh trượt vì đã xử lý trong click event
							case " ":
								event.preventDefault(); // Ngăn cuộn trang khi nhấn space
								const player = document.querySelector("audio, video");
								if (player) {
									if (player.paused) {
										player.play();
									} else {
										player.pause();
									}
								}
								return;
							default:
								return; // Thoát nếu không phải phím hỗ trợ
						}

						// Cập nhật thanh trượt và kích hoạt sự kiện input
						volumeSlider.value = currentVolume;
						volumeSlider.dispatchEvent(new Event("input"));
					});

					// Play/Pause button function
					function updatePlayPauseButton(isPlaying) {
						const playPauseBtn = document.getElementById("playPauseBtn");
						if (playPauseBtn) {
							const icon = playPauseBtn.querySelector(".material-icons");
							if (icon) {
								icon.textContent = isPlaying ? "pause" : "play_arrow";
							}
						}
					}

					function togglePlayPause() {
						const audio = document.getElementById("audioPlayer");
						if (audio) {
							if (audio.paused) {
								audio.play();
							} else {
								audio.pause();
							}
						}
					}

					function playPrevious() {
						const currentList = playlists[currentPlaylist];
						currentIndex = currentIndex === 0 ? currentList.length - 1 : currentIndex - 1;
						currentPage = Math.floor(currentIndex / pageSize) + 1;
						play(currentIndex);
						renderPagination();
					}

					// Khởi tạo trạng thái mặc định cho các nút
					const initButtonState = (btnId, isActive = false) => {
						const btn = document.getElementById(btnId);
						if (btn) {
							btn.classList.toggle("inactive", !isActive);
							btn.classList.toggle("active", isActive);
						}
					};

					// Thiết lập trạng thái mặc định cho các nút
					initButtonState("noRepeatBtn", false); // isNoRepeat = false = button không active
					initButtonState("repeatBtn"); // isRepeat = false nên không active

					// Set shuffle button active if isRandom is true
					if (isRandom) {
						initButtonState("shuffleBtn", true);
					}

					// Khởi động trang
					renderPlaylist();

					// Đồng bộ danh sách yêu thích giữa các tab
					const handleStorageChange = () => {
						favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
						renderPlaylist();
					};

					window.addEventListener("storage", handleStorageChange);

					// Xuất các hàm cần thiết ra global scope
					Object.assign(window, {
						playNext,
						playPrevious,
						toggleRepeat,
						toggleRandom,
						toggleNoRepeat,
						togglePlayPause,
						updatePlayPauseButton,
						updateProgress,
						formatTime,
					});

					// Ẩn thông tin bài hát khi dừng phát
					document.addEventListener(
						"ended",
						function () {
							document.getElementById("currentSong").classList.add("hidden");
						},
						true,
					);
				})
				.catch((error) => {
					console.error("Lỗi khi tải danh sách phát:", error);
					// Sử dụng Toastify thay vì Swal.fire
					Toastify({
						text: "Lỗi khi tải danh sách phát",
						duration: 2000,
						gravity: "top",
						position: "right",
						stopOnFocus: true,
						style: {
							background: "#1f2937",
							color: "#f3f4f6",
							borderRadius: "8px",
							padding: "10px 15px",
							boxShadow: "0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)",
						},
					}).showToast();
				});
		</script>
	</body>
</html>
