<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<!-- Thẻ favicon cơ bản (đã có) -->
		<link rel="icon" type="image/x-icon" href="https://images.macrumors.com/t/MKlRm9rIBpfcGnjTpf6ZxgpFTUg=/1600x1200/smart/article-new/2018/05/apple-music-note.jpg" />

		<!-- Thêm các thẻ sau cho Android -->
		<link rel="manifest" href="site.webmanifest" />
		<link rel="apple-touch-icon" sizes="192x192" href="https://images.macrumors.com/t/MKlRm9rIBpfcGnjTpf6ZxgpFTUg=/1600x1200/smart/article-new/2018/05/apple-music-note.jpg" />
		<meta name="theme-color" content="#000000" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lofi Music</title>
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
		<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
		<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
		<link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet" />
		<!-- Firebase Compatibility SDKs -->
		<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
		<!-- Firebase configuration -->
		<script src="../js/firebase-config.js"></script>
		<style>
			/* Hiệu ứng nút đang bật */
			.active {
				box-shadow: 0 0 20px rgba(99, 102, 241, 0.7);
				transform: translateY(-3px);
				transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
				border-color: #818cf8;
				z-index: 10;
			}

			/* Hiệu ứng nút đang tắt */
			.inactive {
				opacity: 0.6;
				transform: scale(0.98);
				transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
				filter: grayscale(30%);
			}

			/* Tạo viền cho khung bọc */
			.player-wrapper {
				border: 2px solid #4b5563;
				border-radius: 12px;
				padding: 1rem;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
				transition: all 0.3s ease;
			}

			.player-wrapper:hover {
				border-color: #6b7280;
				box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
			}
		</style>
	</head>
	<body class="bg-gray-800 text-white font-sans text-center p-3 sm:p-5">
		<div class="w-full max-w-2xl mx-auto">
			<div class="player-wrapper">
				<!-- Header -->
				<h1 class="text-xl sm:text-2xl md:text-3xl font-bold mb-3 sm:mb-4 flex items-center justify-center space-x-2 text-gray-100">
					<span>🎧</span>
					<span>Trình Nghe Nhạc</span>
				</h1>

				<!-- Nút điều khiển -->
				<div class="mb-3 sm:mb-4 flex justify-center items-center space-x-2 sm:space-x-3 md:space-x-4">
					<!-- Nút Tiếp -->
					<button onclick="playNext()" class="bg-gray-700 hover:bg-gray-600 text-gray-200 px-2 sm:px-3 md:px-4 py-2 sm:py-3 rounded-lg transition flex flex-col items-center justify-center border border-gray-600 shadow-sm">
						<span class="material-icons text-base sm:text-lg md:text-xl text-blue-400">skip_next</span>
						<span class="hidden sm:block text-sm sm:text-base text-gray-200">Tiếp</span>
					</button>

					<!-- Nút Lặp lại bài hát -->
					<button onclick="toggleRepeat()" id="repeatBtn" class="bg-gray-700 hover:bg-gray-600 text-gray-200 px-2 sm:px-3 md:px-4 py-2 sm:py-3 rounded-lg transition flex flex-col items-center justify-center border border-gray-600 shadow-sm">
						<span class="material-icons text-base sm:text-lg md:text-xl text-purple-400">repeat_one</span>
						<span class="hidden sm:block text-sm sm:text-base text-gray-200">Lặp lại bài</span>
					</button>

					<!-- Nút Ngẫu nhiên -->
					<button onclick="toggleRandom()" class="bg-gray-700 hover:bg-gray-600 text-gray-200 px-2 sm:px-3 md:px-4 py-2 sm:py-3 rounded-lg transition flex flex-col items-center justify-center border border-gray-600 shadow-sm">
						<span class="material-icons text-base sm:text-lg md:text-xl text-green-400">shuffle</span>
						<span class="hidden sm:block text-sm sm:text-base text-gray-200">Ngẫu nhiên</span>
					</button>

					<!-- Nút Tắt phát lại -->
					<button onclick="toggleNoRepeat()" id="noRepeatBtn" class="bg-gray-700 hover:bg-gray-600 text-gray-200 px-2 sm:px-3 md:px-4 py-2 sm:py-3 rounded-lg transition flex flex-col items-center justify-center border border-gray-600 shadow-sm">
						<span class="material-icons text-base sm:text-lg md:text-xl text-red-400">repeat_on</span>
						<span class="hidden sm:block text-sm sm:text-base text-gray-200">Tắt phát lại</span>
					</button>

					<!-- Nút Playlist -->
					<button id="togglePlaylistBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-2 sm:px-3 md:px-4 py-2 sm:py-3 rounded-lg transition flex flex-col items-center justify-center border border-blue-700 shadow-sm">
						<span class="material-icons">queue_music</span>
						<span class="hidden sm:block text-sm sm:text-base text-gray-200">Playlist</span>
					</button>
				</div>

				<!-- Volume Control -->
				<div class="flex items-center justify-center space-x-2 mt-3 sm:mt-4">
					<button id="muteBtn" class="text-lg hover:text-pink-500 transition">
						<span class="material-icons">volume_up</span>
					</button>
					<input type="range" id="volumeSlider" min="0" max="100" value="50" class="w-32 sm:w-48 h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer" />
					<span id="volumeValue" class="text-gray-300">50%</span>
				</div>

				<!-- Player Container -->
				<div id="playerContainer" class="w-full sm:max-w-3xl mx-auto rounded-lg bg-black overflow-hidden mb-3 sm:mb-4"></div>

				<!-- Hiển thị bài hát hiện tại -->
				<div id="currentSong" class="hidden mt-2 sm:mt-3 mb-3 sm:mb-4 flex items-center justify-center space-x-2 text-sm sm:text-base md:text-lg bg-gray-700 p-2 sm:p-2.5 md:p-3 rounded-lg shadow-lg sm:max-w-3xl mx-auto"></div>

				<!-- Playlist Wrapper -->
				<div id="playlistWrapper" style="display: block">
					<select id="categorySelect" class="w-full sm:max-w-3xl bg-gray-500 text-white p-2 sm:p-2.5 rounded"></select>
					<ul id="playlist" class="mt-3 sm:mt-4 sm:max-w-3xl mx-auto bg-gray-700 rounded-lg shadow divide-y divide-gray-600 text-left"></ul>
					<div id="pagination" class="flex justify-center items-center space-x-2 mt-2 sm:mt-3"></div>
				</div>
			</div>

			<script>
				// Initialize Firebase
				firebase.initializeApp(firebaseConfig);
				const auth = firebase.auth();
				const db = firebase.firestore();

				// Kiểm tra đăng nhập
				auth.onAuthStateChanged((user) => {
					if (!user) {
						// Nếu chưa đăng nhập, chuyển hướng về trang đăng nhập
						window.location.href = "../login.html";
					} else {
						// Đã đăng nhập, tải danh sách yêu thích từ Firebase
						loadFavoritesFromFirebase(user.uid);
					}
				});

				// Hàm tải danh sách yêu thích từ Firebase
				async function loadFavoritesFromFirebase(userId) {
					try {
						const doc = await db.collection("userFavorites").doc(userId).get();
						if (doc.exists) {
							favorites = doc.data().favorites || [];
							localStorage.setItem("favorites", JSON.stringify(favorites));
						}
					} catch (error) {
						console.error("Lỗi khi tải danh sách yêu thích:", error);
					}
				}

				// Hàm lưu danh sách yêu thích lên Firebase
				async function saveFavoritesToFirebase(userId, favorites) {
					try {
						await db.collection("userFavorites").doc(userId).set(
							{
								favorites: favorites,
								lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
							},
							{ merge: true }
						);
					} catch (error) {
						console.error("Lỗi khi lưu danh sách yêu thích:", error);
					}
				}

				// Load playlists from JSON file
				fetch("js/playlists.json")
					.then((response) => response.json())
					.then((playlists) => {
						const MUSIC_FOLDER = "music/";

						// Tạo danh sách "Tất cả bài hát"
						const allSongs = [];
						Object.values(playlists).forEach((songs) => {
							if (Array.isArray(songs)) {
								songs.forEach((filename) => {
									const path = MUSIC_FOLDER + filename + ".mp3";
									allSongs.push({
										path: path,
										title: filename,
									});
								});
							}
						});
						playlists["Tất cả bài hát"] = allSongs;

						// Cập nhật danh sách yêu thích từ local storage
						let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
						favorites = Array.isArray(favorites) ? favorites : [];

						// Cập nhật danh sách yêu thích
						playlists["Danh Sách Yêu Thích"] = [];
						favorites.forEach((favoriteUrl) => {
							for (const [playlistName, songs] of Object.entries(playlists)) {
								if (playlistName === "Tất cả bài hát" || playlistName === "Danh Sách Yêu Thích") continue;

								// Chỉ lấy tên file để so sánh (bỏ đi thư mục và đuôi .mp3)
								const favoriteFilename = favoriteUrl.replace(MUSIC_FOLDER, "").replace(/\.mp3$/, "");
								const song = songs.find((songPath) => songPath === favoriteFilename);

								if (song) {
									playlists["Danh Sách Yêu Thích"].push({
										path: MUSIC_FOLDER + song + ".mp3",
										title: song,
									});
									break;
								}
							}
						});

						// Cập nhật select box
						const categorySelect = document.getElementById("categorySelect");
						categorySelect.innerHTML = "";
						Object.keys(playlists).forEach((playlistName) => {
							const option = document.createElement("option");
							option.value = playlistName;
							option.textContent = playlistName;
							categorySelect.appendChild(option);
						});

						let currentPlaylist = "Tất cả bài hát";
						let currentIndex = 0;
						let isRandom = true;
						let isNoRepeat = false;
						let currentPage = 1;
						const pageSize = 10;
						let playedSongs = new Set();

						const playerContainer = document.getElementById("playerContainer");
						const currentSongDisplay = document.getElementById("currentSong");
						const playlist = document.getElementById("playlist");
						const playlistWrapper = document.getElementById("playlistWrapper");
						const togglePlaylistBtn = document.getElementById("togglePlaylistBtn");

						categorySelect.addEventListener("change", function () {
							currentPlaylist = this.value;
							currentIndex = 0;
							currentPage = 1;
							renderPlaylist();
						});

						function renderPlaylist() {
							playlist.innerHTML = "";
							const currentList = playlists[currentPlaylist];

							// Kiểm tra nếu là playlist đặc biệt (đã được xử lý sẵn)
							const isSpecialPlaylist = currentPlaylist === "Tất cả bài hát" || currentPlaylist === "Danh Sách Yêu Thích";

							const start = (currentPage - 1) * pageSize;
							const end = Math.min(start + pageSize, currentList.length);

							for (let idx = start; idx < end; idx++) {
								let song, url, title;

								if (isSpecialPlaylist) {
									// Đã có đầy đủ thông tin
									song = currentList[idx];
									url = song.path;
									title = song.title;
								} else {
									// Tạo đối tượng song từ tên file
									const filename = currentList[idx];
									url = MUSIC_FOLDER + filename + ".mp3";
									title = filename.replace(/\.mp3$/, "");
								}

								const isFavorite = favorites.some((fav) => fav === url);

								const li = document.createElement("li");
								li.className = "flex items-center justify-between px-3 sm:px-4 py-2 hover:bg-gray-600 transition " + (idx === currentIndex ? "bg-gray-500 font-bold" : "");

								const songContainer = document.createElement("div");
								songContainer.className = "flex items-center space-x-2";
								let icon = "🎶";
								songContainer.innerHTML = `<span class="text-xl">${icon}</span><span>${title}</span>`;
								li.appendChild(songContainer);

								const favoriteBtn = document.createElement("button");
								favoriteBtn.className = "text-xl hover:text-pink-500 transition";
								favoriteBtn.innerHTML = isFavorite ? "❤️" : "🤍";
								favoriteBtn.onclick = (event) => {
									event.stopPropagation();
									toggleFavorite(url);
								};
								li.appendChild(favoriteBtn);

								li.onclick = (event) => {
									if (event.target !== favoriteBtn) {
										currentIndex = idx;
										play(currentIndex);
										renderPlaylist();
									}
								};
								playlist.appendChild(li);
							}
							renderPagination();
						}

						function renderPagination() {
							const pagination = document.getElementById("pagination");
							pagination.innerHTML = "";
							const totalPages = Math.ceil(playlists[currentPlaylist].length / pageSize);
							const isMobile = window.innerWidth <= 360; // 768px là breakpoint phổ biến cho mobile
							const maxVisiblePages = isMobile ? 3 : 15; // 3 cho mobile, 15 cho desktop
							let startPage, endPage;

							// Tính toán trang bắt đầu và kết thúc để hiển thị
							if (totalPages <= maxVisiblePages) {
								startPage = 1;
								endPage = totalPages;
							} else {
								// Tính toán để trang hiện tại luôn nằm giữa
								const maxPagesBeforeCurrent = Math.floor(maxVisiblePages / 2);
								const maxPagesAfterCurrent = Math.ceil(maxVisiblePages / 2) - 1;

								if (currentPage <= maxPagesBeforeCurrent) {
									// Trang hiện tại gần đầu
									startPage = 1;
									endPage = maxVisiblePages;
								} else if (currentPage + maxPagesAfterCurrent >= totalPages) {
									// Trang hiện tại gần cuối
									startPage = totalPages - maxVisiblePages + 1;
									endPage = totalPages;
								} else {
									// Trang hiện tại ở giữa
									startPage = currentPage - maxPagesBeforeCurrent;
									endPage = currentPage + maxPagesAfterCurrent;
								}
							}

							// Nút Previous
							const prevBtn = document.createElement("button");
							prevBtn.textContent = "«";
							prevBtn.disabled = currentPage === 1;
							prevBtn.className = "px-2 py-1 rounded bg-gray-600 hover:bg-gray-500 disabled:opacity-50";
							prevBtn.onclick = () => {
								if (currentPage > 1) {
									currentPage--;
									renderPlaylist();
								}
							};
							pagination.appendChild(prevBtn);

							// Nút trang đầu tiên
							if (startPage > 1) {
								const firstPageBtn = document.createElement("button");
								firstPageBtn.textContent = "1";
								firstPageBtn.className = "px-2 py-1 rounded bg-gray-600 hover:bg-gray-500";
								firstPageBtn.onclick = () => {
									currentPage = 1;
									renderPlaylist();
								};
								pagination.appendChild(firstPageBtn);

								// Thêm dấu "..." nếu cần
								if (startPage > 2) {
									const ellipsis = document.createElement("span");
									ellipsis.textContent = "...";
									ellipsis.className = "px-1";
									pagination.appendChild(ellipsis);
								}
							}

							// Các nút trang
							for (let i = startPage; i <= endPage; i++) {
								const pageBtn = document.createElement("button");
								pageBtn.textContent = i;
								pageBtn.className = "px-2 py-1 rounded " + (i === currentPage ? "bg-blue-500 text-white" : "bg-gray-600 hover:bg-gray-500");
								pageBtn.onclick = () => {
									currentPage = i;
									renderPlaylist();
								};
								pagination.appendChild(pageBtn);
							}

							// Nút trang cuối cùng
							if (endPage < totalPages) {
								// Thêm dấu "..." nếu cần
								if (endPage < totalPages - 1) {
									const ellipsis = document.createElement("span");
									ellipsis.textContent = "...";
									ellipsis.className = "px-1";
									pagination.appendChild(ellipsis);
								}

								const lastPageBtn = document.createElement("button");
								lastPageBtn.textContent = totalPages;
								lastPageBtn.className = "px-2 py-1 rounded bg-gray-600 hover:bg-gray-500";
								lastPageBtn.onclick = () => {
									currentPage = totalPages;
									renderPlaylist();
								};
								pagination.appendChild(lastPageBtn);
							}

							// Nút Next
							const nextBtn = document.createElement("button");
							nextBtn.textContent = "»";
							nextBtn.disabled = currentPage === totalPages;
							nextBtn.className = "px-2 py-1 rounded bg-gray-600 hover:bg-gray-500 disabled:opacity-50";
							nextBtn.onclick = () => {
								if (currentPage < totalPages) {
									currentPage++;
									renderPlaylist();
								}
							};
							pagination.appendChild(nextBtn);
						}

						function play(index) {
							const currentList = playlists[currentPlaylist];
							const isSpecialPlaylist = currentPlaylist === "Tất cả bài hát" || currentPlaylist === "Danh Sách Yêu Thích";

							let song = currentList[index];

							// Nếu là playlist thông thường, tạo đối tượng song từ tên file
							if (!isSpecialPlaylist) {
								song = {
									path: MUSIC_FOLDER + song + ".mp3",
									title: typeof song === "string" ? song.replace(/\.mp3$/, "") : song.title,
								};
							}

							let audio = document.getElementById("audioPlayer");
							const titleElement = document.getElementById("title");
							const artistElement = document.getElementById("artist");
							const albumArt = document.getElementById("albumArt");

							let icon = "🎶";

							// Tạo audio player nếu chưa tồn tại
							if (!audio) {
								audio = document.createElement("audio");
								audio.id = "audioPlayer";
								audio.controls = true;
								audio.className = "w-full";
								audio.volume = volumeSlider.value / 100;
								audio.addEventListener("ended", function () {
									if (isRepeat) play(currentIndex);
									else playNext();
								});
								playerContainer.appendChild(audio);
							}

							// Cập nhật title của trang
							document.title = song.title;

							// Cập nhật thông tin bài hát
							if (titleElement) {
								titleElement.textContent = song.title;
							}

							if (artistElement) {
								artistElement.textContent = song.title;
							}

							// Hiển thị thông tin bài hát hiện tại
							currentSongDisplay.innerHTML = `<span class="text-xl">${icon}</span> <span>${song.title}</span>`;
							document.getElementById("currentSong").classList.remove("hidden");

							// Cập nhật player
							audio.src = song.path;
							audio.play();
							if (isRandom) {
								playedSongs.add(song.path);
							}

							// Cập nhật UI
							currentIndex = index;
							renderPlaylist();
						}

						let isRepeat = false;

						function toggleRepeat() {
							isRepeat = !isRepeat;
							const repeatBtn = document.getElementById("repeatBtn");
							if (repeatBtn) {
								if (isRepeat) {
									repeatBtn.classList.add("active");
									repeatBtn.classList.remove("inactive");
								} else {
									repeatBtn.classList.add("inactive");
									repeatBtn.classList.remove("active");
								}
							}
							// Sử dụng Toastify thay vì Swal.fire
							Toastify({
								text: isRepeat ? "🔁 Đã bật lặp lại bài" : "⏭️ Đã tắt lặp lại bài",
								duration: 2000,
								gravity: "top",
								position: "right",
								stopOnFocus: true,
								style: {
									background: isRepeat ? "#4f46e5" : "#1f2937",
									color: "#f3f4f6",
									borderRadius: "8px",
									padding: "10px 15px",
									boxShadow: "0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)",
								},
							}).showToast();
						}

						function playNext() {
							const currentList = playlists[currentPlaylist];
							if (isRandom) {
								let nextIndex;
								const nonYoutubeIndexes = currentList.map((item, idx) => (!item.path.includes("youtube.com") && !item.path.includes("youtu.be") ? idx : -1)).filter((idx) => idx !== -1);

								if (isNoRepeat) {
									// Lọc các bài hát chưa được phát
									const availableIndexes = nonYoutubeIndexes.filter((idx) => !playedSongs.has(idx));

									if (availableIndexes.length === 0) {
										// Nếu tất cả bài hát đã được phát, reset set và lấy lại bài hát đầu tiên
										playedSongs.clear();
										nextIndex = nonYoutubeIndexes[0];
									} else {
										// Chọn ngẫu nhiên từ các bài hát chưa được phát
										const randomPos = Math.floor(Math.random() * availableIndexes.length);
										nextIndex = availableIndexes[randomPos];
									}
									playedSongs.add(nextIndex);
								} else {
									// Nếu không bật "Không lặp lại", hoạt động như bình thường
									nextIndex = nonYoutubeIndexes[Math.floor(Math.random() * nonYoutubeIndexes.length)];
								}
								currentIndex = nextIndex;
								// Cập nhật currentPage dựa trên bài hát mới
								currentPage = Math.floor(nextIndex / pageSize) + 1;
							} else {
								currentIndex = (currentIndex + 1) % currentList.length;
								// Cập nhật currentPage dựa trên bài hát mới
								currentPage = Math.floor(currentIndex / pageSize) + 1;
							}
							play(currentIndex);
							renderPagination();
						}

						function toggleNoRepeat() {
							isNoRepeat = !isNoRepeat;
							const noRepeatBtn = document.getElementById("noRepeatBtn");
							if (noRepeatBtn) {
								if (isNoRepeat) {
									playedSongs.clear();
									noRepeatBtn.classList.add("active");
									noRepeatBtn.classList.remove("inactive");
								} else {
									playedSongs.clear();
									noRepeatBtn.classList.add("inactive");
									noRepeatBtn.classList.remove("active");
								}
							}
							// Sử dụng Toastify thay vì Swal.fire
							Toastify({
								text: isNoRepeat ? "🔄 Đã tắt phát lại" : "🔄 Đã bật phát lại",
								duration: 2000,
								gravity: "top",
								position: "right",
								stopOnFocus: true,
								style: {
									background: isNoRepeat ? "#4f46e5" : "#1f2937",
									color: "#f3f4f6",
									borderRadius: "8px",
									padding: "10px 15px",
									boxShadow: "0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)",
								},
							}).showToast();
						}

						function toggleRandom() {
							isRandom = !isRandom;
							const randomBtn = document.querySelector('button[onclick="toggleRandom()"]');
							if (randomBtn) {
								const modeSpan = randomBtn.querySelector("span:last-child");
								if (modeSpan) {
									modeSpan.textContent = isRandom ? "Ngẫu nhiên" : "Tuần tự";
								}
								// Thay đổi icon
								const icon = randomBtn.querySelector("span:first-child");
								if (icon) {
									icon.textContent = isRandom ? "shuffle" : "queue_play_next";
								}
							}
							// Sử dụng Toastify thay vì Swal.fire
							Toastify({
								text: isRandom ? "🔀 Đã bật chế độ ngẫu nhiên" : "⏭️ Đã tắt chế độ ngẫu nhiên",
								duration: 2000,
								gravity: "top",
								position: "right",
								stopOnFocus: true,
								style: {
									background: isRandom ? "#4f46e5" : "#1f2937",
									color: "#f3f4f6",
									borderRadius: "8px",
									padding: "10px 15px",
									boxShadow: "0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)",
								},
							}).showToast();
						}

						function toggleFavorite(url) {
							const user = auth.currentUser;
							if (!user) {
								window.location.href = "../login.html";
								return;
							}

							const isFavorite = favorites.includes(url);
							if (isFavorite) {
								favorites = favorites.filter((song) => song !== url);
								// Xóa bài hát khỏi danh sách yêu thích
								const index = playlists["Danh Sách Yêu Thích"].findIndex((song) => song.path === url);
								if (index !== -1) {
									playlists["Danh Sách Yêu Thích"].splice(index, 1);
								}
							} else {
								favorites.push(url);
								// Thêm bài hát vào danh sách yêu thích
								const currentList = playlists[currentPlaylist];
								const songIndex = currentList.findIndex((song) => song.path === url);
								if (songIndex !== -1) {
									playlists["Danh Sách Yêu Thích"].push(currentList[songIndex]);
								}
							}

							// Lưu vào localStorage
							localStorage.setItem("favorites", JSON.stringify(favorites));

							// Lưu lên Firebase
							saveFavoritesToFirebase(user.uid, favorites);

							renderPlaylist();
						}

						// Volume control
						const volumeSlider = document.getElementById("volumeSlider");
						const volumeValue = document.getElementById("volumeValue");
						const muteBtn = document.getElementById("muteBtn");
						let isMuted = false;

						if (volumeSlider && muteBtn) {
							// Xử lý sự kiện khi di chuyển thanh trượt
							volumeSlider.addEventListener("input", function () {
								const volume = this.value / 100;
								volumeValue.textContent = `${this.value}%`;

								// Hủy mute nếu đang mute
								if (isMuted) {
									isMuted = false;
									muteBtn.innerHTML = '<span class="material-icons">volume_up</span>';
								}

								// Update volume for all audio elements
								const audioElements = document.getElementsByTagName("audio");
								const videoElements = document.getElementsByTagName("video");
								const iframeElements = document.getElementsByTagName("iframe");

								// Update volume for audio elements
								for (let audio of audioElements) {
									audio.volume = isMuted ? 0 : volume;
								}

								// Update volume for video elements
								for (let video of videoElements) {
									video.volume = isMuted ? 0 : volume;
								}

								// Update volume for YouTube iframes
								for (let iframe of iframeElements) {
									if (iframe.src.includes("youtube.com") || iframe.src.includes("youtu.be")) {
										iframe.contentWindow.postMessage(
											JSON.stringify({
												event: "command",
												func: "setVolume",
												args: [isMuted ? 0 : volume * 100],
											}),
											"*"
										);
									}
								}
							});

							// Xử lý sự kiện khi click nút mute
							muteBtn.onclick = function () {
								isMuted = !isMuted;
								const volume = volumeSlider.value / 100;

								// Update icon
								this.innerHTML = isMuted ? '<span class="material-icons">volume_off</span>' : '<span class="material-icons">volume_up</span>';

								// Update volume for all elements
								const audioElements = document.getElementsByTagName("audio");
								const videoElements = document.getElementsByTagName("video");
								const iframeElements = document.getElementsByTagName("iframe");

								// Update volume for audio elements
								for (let audio of audioElements) {
									audio.volume = isMuted ? 0 : volume;
								}

								// Update volume for video elements
								for (let video of videoElements) {
									video.volume = isMuted ? 0 : volume;
								}

								// Update volume for YouTube iframes
								for (let iframe of iframeElements) {
									if (iframe.src.includes("youtube.com") || iframe.src.includes("youtu.be")) {
										iframe.contentWindow.postMessage(
											JSON.stringify({
												event: "command",
												func: "setVolume",
												args: [isMuted ? 0 : volume * 100],
											}),
											"*"
										);
									}
								}
							};

							// Set initial volume
							volumeSlider.value = 50;
							volumeValue.textContent = "50%";

							// Apply initial volume to all elements
							const audioElements = document.getElementsByTagName("audio");
							const videoElements = document.getElementsByTagName("video");
							const iframeElements = document.getElementsByTagName("iframe");

							for (let audio of audioElements) {
								audio.volume = 0.5;
							}

							for (let video of videoElements) {
								video.volume = 0.5;
							}

							for (let iframe of iframeElements) {
								if (iframe.src.includes("youtube.com") || iframe.src.includes("youtu.be")) {
									iframe.contentWindow.postMessage(
										JSON.stringify({
											event: "command",
											func: "setVolume",
											args: [50],
										}),
										"*"
									);
								}
							}
						}

						// Thêm sự kiện lắng nghe phím
						document.addEventListener("keydown", function (event) {
							const volumeSlider = document.getElementById("volumeSlider");
							if (!volumeSlider) return;

							let currentVolume = parseInt(volumeSlider.value);
							const step = 1; // Bước nhảy âm lượng

							switch (event.key) {
								case "ArrowRight":
									event.preventDefault();
									currentVolume = Math.min(100, currentVolume + step);
									break;
								case "ArrowLeft":
									event.preventDefault();
									currentVolume = Math.max(0, currentVolume - step);
									break;
								case "m":
								case "M":
									event.preventDefault();
									const muteBtn = document.getElementById("muteBtn");
									if (muteBtn) muteBtn.click();
									return; // Không cần cập nhật thanh trượt vì đã xử lý trong click event
								case " ":
									event.preventDefault(); // Ngăn cuộn trang khi nhấn space
									const player = document.querySelector("audio, video");
									if (player) {
										if (player.paused) {
											player.play();
										} else {
											player.pause();
										}
									}
									return;
								default:
									return; // Thoát nếu không phải phím hỗ trợ
							}

							// Cập nhật thanh trượt và kích hoạt sự kiện input
							volumeSlider.value = currentVolume;
							volumeSlider.dispatchEvent(new Event("input"));
						});

						// Ẩn/hiện playlist
						let isPlaylistVisible = true;

						togglePlaylistBtn.onclick = () => {
							isPlaylistVisible = !isPlaylistVisible;
							playlistWrapper.style.display = isPlaylistVisible ? "block" : "none";
						};

						// Khởi tạo trạng thái mặc định cho các nút
						const initButtonState = (btnId, isActive = false) => {
							const btn = document.getElementById(btnId);
							if (btn) {
								btn.classList.toggle("inactive", !isActive);
								btn.classList.toggle("active", isActive);
							}
						};

						// Thiết lập trạng thái mặc định cho các nút
						initButtonState("noRepeatBtn");
						initButtonState("repeatBtn");

						// Khởi động trang
						renderPlaylist();

						// Đồng bộ danh sách yêu thích giữa các tab
						const handleStorageChange = () => {
							favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
							renderPlaylist();
						};

						window.addEventListener("storage", handleStorageChange);

						// Xuất các hàm cần thiết ra global scope
						Object.assign(window, {
							playNext,
							toggleRepeat,
							toggleRandom,
							toggleNoRepeat,
						});

						// Ẩn thông tin bài hát khi dừng phát
						document.addEventListener(
							"ended",
							function () {
								document.getElementById("currentSong").classList.add("hidden");
							},
							true
						);
					})
					.catch((error) => {
						console.error("Lỗi khi tải danh sách phát:", error);
						// Sử dụng Toastify thay vì Swal.fire
						Toastify({
							text: "Lỗi khi tải danh sách phát",
							duration: 2000,
							gravity: "top",
							position: "right",
							stopOnFocus: true,
							style: {
								background: "#1f2937",
								color: "#f3f4f6",
								borderRadius: "8px",
								padding: "10px 15px",
								boxShadow: "0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)",
							},
						}).showToast();
					});
			</script>
		</div>
	</body>
</html>
