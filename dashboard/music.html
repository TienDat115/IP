<html lang="vi">
	<head>
		<meta charset="UTF-8" />

		<link rel="apple-touch-icon" sizes="192x192" href="https://images.macrumors.com/t/MKlRm9rIBpfcGnjTpf6ZxgpFTUg=/1600x1200/smart/article-new/2018/05/apple-music-note.jpg" />

		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Trình phát nhạc cá nhân tối ưu tốc độ tải và trải nghiệm mượt mà trên desktop và mobile." />
		<title>Lofi Music</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
		<link rel="preload" href="js/playlists.json" as="fetch" crossorigin />
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
		<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
		<link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet" />
		<!-- Firebase Compatibility SDKs -->
		<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
		<!-- Firebase configuration -->
		<script src="../js/firebase-config.js"></script>
		<style>
			/* Spotify Color Palette */
			:root {
				--spotify-black: #191414;
				--spotify-green: #1db954;
				--spotify-green-hover: #1ed760;
				--spotify-gray: #282828;
				--spotify-gray-light: #3e3e3e;
				--spotify-gray-lighter: #535353;
				--spotify-white: #ffffff;
				--spotify-gray-text: #b3b3b3;
			}

			/* Global Styles */
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				background-color: var(--spotify-black);
				color: var(--spotify-white);
				font-family:
					"Circular",
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					Roboto,
					Oxygen,
					Ubuntu,
					Cantarell,
					sans-serif;
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				min-height: 100vh;
			}

			/* Main Layout */
			.spotify-container {
				display: grid;
				grid-template-rows: 1fr 90px;
				min-height: 100vh;
			}

			.main-content {
				display: grid;
				grid-template-columns: 240px 1fr;
				min-height: 0;
				overflow: hidden;
			}

			/* Sidebar Styles */
			.sidebar {
				background-color: var(--spotify-black);
				padding: 24px 16px;
				border-right: 1px solid var(--spotify-gray);
				overflow-y: auto;
			}

			.sidebar-section {
				margin-bottom: 24px;
			}

			.sidebar-logo {
				font-size: 24px;
				font-weight: 900;
				color: var(--spotify-white);
				margin-bottom: 24px;
				display: flex;
				align-items: center;
				gap: 8px;
			}

			.sidebar-nav {
				list-style: none;
			}

			.sidebar-nav li {
				margin-bottom: 8px;
			}

			.sidebar-nav a {
				color: var(--spotify-gray-text);
				text-decoration: none;
				font-size: 14px;
				font-weight: 600;
				padding: 10px 12px;
				border-radius: 4px;
				display: flex;
				align-items: center;
				gap: 16px;
				transition: all 0.2s ease;
			}

			.sidebar-nav a:hover {
				color: var(--spotify-white);
				background-color: var(--spotify-gray-light);
			}

			.sidebar-nav a.active {
				color: var(--spotify-white);
				background-color: var(--spotify-gray-light);
			}

			/* Content Area */
			.content-area {
				background: linear-gradient(to bottom, #1e1e1e 0%, var(--spotify-black) 100%);
				padding: 16px;
				overflow-y: auto;
				overflow-x: hidden;
				height: 100%;
			}

			/* Custom Scrollbar */
			.content-area::-webkit-scrollbar {
				width: 12px;
			}

			.content-area::-webkit-scrollbar-track {
				background: var(--spotify-gray);
				border-radius: 6px;
			}

			.content-area::-webkit-scrollbar-thumb {
				background: var(--spotify-gray-light);
				border-radius: 6px;
				border: 2px solid var(--spotify-gray);
			}

			.content-area::-webkit-scrollbar-thumb:hover {
				background: var(--spotify-gray-lighter);
			}

			.content-area::-webkit-scrollbar-thumb:active {
				background: var(--spotify-green);
			}

			/* Firefox */
			.content-area * {
				scrollbar-width: thin;
				scrollbar-color: var(--spotify-gray) var(--spotify-gray-light);
			}

			.content-area *::-webkit-scrollbar {
				scrollbar-width: thin;
			}

			/* Progress Bar */
			.progress-container {
				display: flex;
				align-items: center;
				gap: 8px;
			}

			.progress-time {
				color: var(--spotify-gray-text);
				font-size: 11px;
				min-width: 40px;
			}

			.progress-bar {
				flex: 1;
				height: 4px;
				background-color: var(--spotify-gray-light);
				border-radius: 2px;
				position: relative;
				cursor: pointer;
			}

			.progress-bar:hover .progress-hover {
				height: 8px;
				top: -2px;
			}

			.progress-hover {
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				bottom: 0;
				background-color: var(--spotify-gray-light);
				border-radius: 2px;
				transition:
					height 0.2s ease,
					top 0.2s ease;
			}

			.progress-fill {
				height: 100%;
				background-color: var(--spotify-white);
				border-radius: 2px;
				width: 0%;
				transition: width 0.1s linear;
				position: relative;
			}

			.progress-bar:hover .progress-fill {
				background-color: var(--spotify-green);
			}

			/* Player Bar */
			.player-bar {
				background-color: var(--spotify-gray);
				border-top: 1px solid var(--spotify-gray-light);
				padding: 16px;
				display: grid;
				grid-template-columns: 1fr 2fr 1fr;
				align-items: center;
				gap: 16px;
			}

			.player-center {
				display: flex;
				flex-direction: column;
				gap: 4px;
			}

			/* Player Controls */
			.player-controls {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 16px;
			}

			.player-btn {
				background: none;
				border: none;
				color: var(--spotify-gray-text);
				cursor: pointer;
				padding: 8px;
				border-radius: 50%;
				transition: all 0.2s ease;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.player-btn:hover {
				color: var(--spotify-white);
				background-color: var(--spotify-gray-light);
			}

			.player-btn.play-btn {
				background-color: var(--spotify-white);
				color: var(--spotify-black);
				width: 32px;
				height: 32px;
			}

			.player-btn .material-icons {
				font-size: 20px;
				display: block;
				line-height: 1;
			}

			.player-btn.play-btn:hover {
				background-color: var(--spotify-green-hover);
				transform: scale(1.05);
			}

			/* Track Info */
			.track-info {
				display: flex;
				align-items: center;
				gap: 12px;
			}

			.track-art {
				width: 56px;
				height: 56px;
				background-color: var(--spotify-gray-light);
				border-radius: 4px;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 24px;
			}

			.track-details {
				flex: 1;
			}

			.track-name {
				color: var(--spotify-white);
				font-size: 14px;
				font-weight: 400;
				margin-bottom: 4px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				max-width: 300px;
			}

			.track-artist {
				color: var(--spotify-gray-text);
				font-size: 11px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				max-width: 300px;
			}

			/* Volume Control */
			.volume-control {
				display: flex;
				align-items: center;
				justify-content: flex-end;
				gap: 8px;
				min-width: 0;
				flex-shrink: 0;
			}

			.volume-slider {
				width: 100px;
				height: 4px;
				background-color: var(--spotify-gray-light);
				border-radius: 2px;
				outline: none;
				-webkit-appearance: none;
				-moz-appearance: none;
				appearance: none;
				flex-shrink: 0;
				min-width: 0;
			}

			.volume-slider::-webkit-slider-thumb {
				-webkit-appearance: none;
				width: 12px;
				height: 12px;
				background-color: var(--spotify-white);
				border-radius: 50%;
				cursor: pointer;
				flex-shrink: 0;
			}

			.volume-slider::-moz-range-thumb {
				width: 12px;
				height: 12px;
				background-color: var(--spotify-white);
				border-radius: 50%;
				cursor: pointer;
				border: none;
				flex-shrink: 0;
			}

			.volume-slider::-webkit-slider-thumb:hover {
				background-color: var(--spotify-green);
				transform: scale(1.1);
			}

			.volume-slider::-moz-range-thumb:hover {
				background-color: var(--spotify-green);
				transform: scale(1.1);
			}

			/* Playlist Section */
			.playlist-section {
				margin-bottom: 20px;
			}

			.section-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 12px;
			}

			.section-title {
				font-size: 24px;
				font-weight: 700;
				color: var(--spotify-white);
			}

			.category-select {
				background-color: var(--spotify-gray-light);
				color: var(--spotify-white);
				border: 1px solid var(--spotify-gray-lighter);
				padding: 8px 12px;
				border-radius: 4px;
				font-size: 14px;
				cursor: pointer;
			}

			.playlist-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
				gap: 24px;
			}

			.playlist-item {
				background-color: var(--spotify-gray-light);
				border-radius: 8px;
				padding: 16px;
				cursor: pointer;
				transition: all 0.3s ease;
				position: relative;
			}

			.playlist-item:hover {
				background-color: var(--spotify-gray-lighter);
			}

			.playlist-item:hover .play-overlay {
				opacity: 1;
				transform: translateY(0);
			}

			.play-overlay {
				position: absolute;
				bottom: 16px;
				right: 16px;
				background-color: var(--spotify-green);
				width: 48px;
				height: 48px;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				opacity: 0;
				transform: translateY(8px);
				transition: all 0.3s ease;
				box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
			}

			.play-overlay:hover {
				background-color: var(--spotify-green-hover);
				transform: scale(1.05);
			}

			.playlist-cover {
				width: 100%;
				height: 180px;
				background-color: var(--spotify-gray);
				border-radius: 4px;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 48px;
				margin-bottom: 12px;
			}

			.playlist-title {
				color: var(--spotify-white);
				font-size: 14px;
				font-weight: 600;
				margin-bottom: 4px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.playlist-description {
				color: var(--spotify-gray-text);
				font-size: 12px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			/* Song List */
			.song-list {
				background-color: var(--spotify-gray-light);
				border-radius: 8px;
				padding: 12px;
				content-visibility: auto;
				contain-intrinsic-size: 600px;
			}

			.song-item {
				display: grid;
				grid-template-columns: 16px 1fr 100px 60px;
				align-items: center;
				padding: 8px;
				border-radius: 4px;
				transition: all 0.2s ease;
				gap: 16px;
			}

			.song-item:hover {
				background-color: var(--spotify-gray-lighter);
			}

			.song-item.playing {
				color: var(--spotify-green);
				background-color: rgba(30, 215, 96, 0.1);
				border-left: 3px solid var(--spotify-green);
			}

			.song-item.playing .song-number::before {
				content: "🎵";
				font-size: 12px;
				animation: pulse 1.5s infinite;
			}

			.song-item.playing .song-number {
				color: var(--spotify-green);
				font-weight: 600;
			}

			@keyframes pulse {
				0%,
				100% {
					opacity: 1;
					transform: scale(1);
				}
				50% {
					opacity: 0.7;
					transform: scale(1.1);
				}
			}

			.song-number {
				color: var(--spotify-gray-text);
				font-size: 14px;
				text-align: center;
			}

			.song-info {
				display: flex;
				align-items: center;
				gap: 12px;
			}

			.song-icon {
				font-size: 20px;
			}

			.song-title {
				color: var(--spotify-white);
				font-size: 14px;
				font-weight: 400;
			}

			.song-duration {
				color: var(--spotify-gray-text);
				font-size: 14px;
				text-align: right;
			}

			.favorite-btn {
				background: none;
				border: none;
				color: var(--spotify-gray-text);
				cursor: pointer;
				font-size: 18px;
				padding: 4px;
				transition: all 0.2s ease;
			}

			.favorite-btn:hover {
				color: var(--spotify-white);
				transform: scale(1.1);
			}

			.favorite-btn.active {
				color: #ff6b6b;
			}

			/* Pagination */
			.pagination {
				display: flex;
				justify-content: center;
				align-items: center;
				gap: 8px;
				margin-top: 24px;
			}

			.pagination button {
				background-color: var(--spotify-gray-light);
				color: var(--spotify-white);
				border: none;
				padding: 8px 12px;
				border-radius: 4px;
				cursor: pointer;
				font-size: 14px;
				transition: all 0.2s ease;
			}

			.pagination button:hover:not(:disabled) {
				background-color: var(--spotify-gray-lighter);
			}

			.pagination button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}

			.pagination button.active {
				background-color: var(--spotify-green);
			}

			/* Control Buttons */
			.control-buttons {
				display: flex;
				gap: 8px;
				margin-bottom: 16px;
			}

			.control-btn {
				background-color: var(--spotify-gray-light);
				color: var(--spotify-white);
				border: none;
				padding: 8px 16px;
				border-radius: 20px;
				cursor: pointer;
				font-size: 14px;
				font-weight: 600;
				transition: all 0.2s ease;
				display: flex;
				align-items: center;
				gap: 8px;
			}

			.control-btn:hover {
				background-color: var(--spotify-gray-lighter);
				transform: translateY(-1px);
			}

			.control-btn.active {
				background-color: var(--spotify-green);
				color: var(--spotify-black);
				box-shadow: 0 2px 8px rgba(30, 215, 96, 0.3);
				transform: translateY(-1px);
			}

			/* Responsive Design */
			@media (max-width: 1024px) {
				.main-content {
					grid-template-columns: 200px 1fr;
				}

				.sidebar {
					padding: 16px 12px;
				}

				.sidebar-logo {
					font-size: 20px;
				}

				.content-area {
					padding: 16px;
				}
			}

			@media (max-width: 768px) {
				.main-content {
					grid-template-columns: 1fr;
				}

				.sidebar {
					display: none;
				}

				.player-bar {
					grid-template-columns: 1fr auto;
					gap: 12px;
					padding: 12px 16px;
					height: auto;
					min-height: 90px;
				}

				.track-info {
					flex: 1;
					min-width: 0;
				}

				.player-center {
					gap: 8px;
					flex: 1;
					display: flex;
					flex-direction: column;
				}

				.progress-container {
					order: -1;
					margin-bottom: 8px;
					width: 100%;
				}

				.progress-time {
					font-size: 10px;
					min-width: 35px;
				}

				.player-controls {
					justify-content: center;
					gap: 12px;
					display: flex;
					align-items: center;
					flex-wrap: wrap;
				}

				.volume-control {
					justify-content: flex-end;
					align-items: center;
					gap: 8px;
					min-width: 120px;
					margin-left: auto;
				}

				.volume-slider {
					width: 60px;
				}

				.playlist-grid {
					grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
				}

				.song-item {
					grid-template-columns: 1fr 60px;
					padding: 8px;
				}

				.song-number {
					display: none;
				}

				.song-duration {
					display: none;
				}

				.song-icon {
					font-size: 16px;
				}

				.song-title {
					font-size: 13px;
				}

				.control-buttons {
					flex-wrap: wrap;
					gap: 6px;
					margin-bottom: 16px;
				}

				.control-btn {
					padding: 6px 12px;
					font-size: 12px;
				}

				.control-btn.active {
					background-color: var(--spotify-green);
					color: var(--spotify-black);
					box-shadow: 0 2px 6px rgba(30, 215, 96, 0.3);
				}

				.section-title {
					font-size: 20px;
				}

				.category-select {
					padding: 6px 10px;
					font-size: 12px;
				}
			}

			@media (max-width: 600px) {
				.player-bar {
					grid-template-columns: 1fr;
					gap: 10px;
					padding: 10px 12px;
				}

				.track-info {
					justify-content: center;
					text-align: center;
					margin-bottom: 8px;
				}

				.track-art {
					width: 36px;
					height: 36px;
					font-size: 16px;
				}

				.track-name {
					font-size: 11px;
					max-width: 200px;
				}

				.player-center {
					width: 100%;
				}

				.progress-container {
					margin-bottom: 6px;
				}

				.progress-time {
					font-size: 9px;
					min-width: 30px;
				}

				.player-controls {
					gap: 8px;
					margin-bottom: 8px;
					justify-content: center;
					align-items: center;
				}

				.volume-control {
					justify-content: center;
					min-width: auto;
					width: 100%;
					margin-left: 0;
					margin-top: 8px;
				}

				.volume-slider {
					width: 80px;
				}
			}

			@media (max-width: 480px) {
				.player-bar {
					padding: 8px;
					gap: 8px;
					min-height: 100px;
				}

				.track-info {
					gap: 6px;
				}

				.track-art {
					width: 32px;
					height: 32px;
					font-size: 14px;
				}

				.track-name {
					font-size: 10px;
					max-width: 150px;
				}

				.progress-container {
					gap: 4px;
				}

				.progress-time {
					font-size: 8px;
					min-width: 28px;
				}

				.player-btn {
					padding: 5px;
				}

				.player-btn.play-btn {
					width: 24px;
					height: 24px;
				}

				.player-btn .material-icons {
					font-size: 16px;
				}

				.volume-slider {
					width: 60px;
				}

				.volume-value {
					font-size: 9px;
					min-width: 30px;
				}

				.control-buttons {
					gap: 4px;
					margin-bottom: 12px;
				}

				.control-btn {
					padding: 4px 8px;
					font-size: 11px;
				}

				.control-btn span:last-child {
					display: none;
				}

				.section-header {
					flex-direction: column;
					gap: 12px;
					align-items: stretch;
				}

				.section-title {
					font-size: 18px;
					text-align: center;
				}

				.category-select {
					width: 100%;
				}

				.song-item {
					padding: 6px;
				}

				.song-title {
					font-size: 12px;
				}

				.pagination button {
					padding: 6px 10px;
					font-size: 12px;
				}
			}

			@media (max-width: 360px) {
				.player-bar {
					padding: 6px;
					gap: 6px;
					min-height: 110px;
				}

				.track-art {
					width: 28px;
					height: 28px;
					font-size: 12px;
				}

				.track-name {
					font-size: 9px;
					max-width: 120px;
				}

				.player-controls {
					gap: 6px;
				}

				.player-btn {
					padding: 4px;
				}

				.player-btn.play-btn {
					width: 20px;
					height: 20px;
				}

				.player-btn .material-icons {
					font-size: 14px;
				}

				.volume-slider {
					width: 50px;
				}

				.progress-time {
					font-size: 7px;
					min-width: 25px;
				}
			}

			/* Hide elements that will be replaced */
			.player-wrapper {
				display: none;
			}

			#playerContainer {
				display: none;
			}

			#currentSong {
				display: none;
			}

			#playlistWrapper {
				display: none;
			}

			.hidden {
				display: none !important;
			}
		</style>
	</head>
	<body>
		<div class="spotify-container">
			<div class="main-content">
				<!-- Sidebar -->
				<aside class="sidebar">
					<div class="sidebar-logo">
						<span>🎵</span>
						<span>Spotify</span>
					</div>
				</aside>

				<!-- Content Area -->
				<main class="content-area">
					<!-- Control Buttons -->
					<div class="control-buttons">
						<button onclick="toggleRandom()" class="control-btn" id="shuffleBtn">
							<span class="material-icons">shuffle</span>
							<span>Shuffle</span>
						</button>
						<button onclick="toggleRepeat()" class="control-btn" id="repeatBtn">
							<span class="material-icons">repeat</span>
							<span>Repeat</span>
						</button>
						<button onclick="toggleNoRepeat()" class="control-btn" id="noRepeatBtn">
							<span class="material-icons">repeat_one</span>
							<span>No Repeat</span>
						</button>
						<button onclick="playNext()" class="control-btn">
							<span class="material-icons">skip_next</span>
							<span>Next</span>
						</button>
					</div>

					<!-- Playlist Section -->
					<div class="playlist-section">
						<div class="section-header">
							<h2 class="section-title">Music Library</h2>
							<select id="categorySelect" class="category-select"></select>
						</div>

						<!-- Song List -->
						<div class="song-list" id="songList">
							<!-- Songs will be rendered here -->
						</div>

						<!-- Pagination -->
						<div class="pagination" id="pagination">
							<!-- Pagination will be rendered here -->
						</div>
					</div>

					<!-- Hidden audio player -->
					<div id="playerContainer" style="display: none"></div>
				</main>
			</div>

			<!-- Player Bar -->
			<div class="player-bar">
				<!-- Track Info -->
				<div class="track-info">
					<div class="track-art" id="trackArt">🎵</div>
					<div class="track-details">
						<div class="track-name" id="trackName">No track playing</div>
					</div>
				</div>

				<!-- Progress and Controls -->
				<div class="player-center">
					<!-- Progress Bar -->
					<div class="progress-container">
						<span class="progress-time" id="currentTime">0:00</span>
						<div class="progress-bar" id="progressBar">
							<div class="progress-hover"></div>
							<div class="progress-fill" id="progressFill"></div>
						</div>
						<span class="progress-time" id="totalTime">0:00</span>
					</div>

					<!-- Player Controls -->
					<div class="player-controls">
						<button class="player-btn" onclick="playPrevious()">
							<span class="material-icons">skip_previous</span>
						</button>
						<button class="player-btn play-btn" id="playPauseBtn" onclick="togglePlayPause()">
							<span class="material-icons">play_arrow</span>
						</button>
						<button class="player-btn" onclick="playNext()">
							<span class="material-icons">skip_next</span>
						</button>

						<!-- Volume Control -->
						<div class="volume-control">
							<button class="player-btn" id="muteBtn">
								<span class="material-icons">volume_up</span>
							</button>
							<input type="range" id="volumeSlider" min="0" max="100" value="50" class="volume-slider" />
							<span id="volumeValue" style="color: var(--spotify-gray-text); font-size: 12px; min-width: 40px">50%</span>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Hidden elements for backward compatibility -->
		<div id="currentSong" style="display: none"></div>
		<div id="playlistWrapper" style="display: none">
			<ul id="playlist" style="display: none"></ul>
		</div>

		<script src="js/music-player.js"></script>
	</body>
</html>
