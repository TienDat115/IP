<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/x-icon" href="https://images-eds-ssl.xboxlive.com/image?url=4rt9.lXDC4H_93laV1_eHHFT949fUipzkiFOBH3fAiZZUCdYojwUyX2aTonS1aIwMrx6NUIsHfUHSLzjGJFxxsG72wAo9EWJR4yQWyJJaDaK1XdUso6cUMpI9hAdPUU_FNs11cY1X284vsHrnWtRw7oqRpN1m9YAg21d_aNKnIo-&format=source" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Nhật Ký Hoạt Động - Discord Webhook</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
		<style>
			@media (max-width: 575.98px) {
				.container { margin-top: 10px; }
				.display-5 { font-size: 1.5rem; }
				#logsTable { font-size: 0.8rem; }
				#logsTable .btn-sm { padding: 0.2rem 0.4rem; font-size: 0.7rem; }
				.card-header { flex-direction: column; gap: 0.5rem; align-items: stretch !important; }
				.card-header > div { display: flex; gap: 0.5rem; }
				.card-header > div .btn { flex: 1; }
				.pagination { flex-wrap: wrap; }
			}

		</style>
	</head>
	<body>
		<div class="container-fluid">
			<div class="text-center mb-4">
				<h1 class="display-5 fw-bold text-gradient mb-3 mt-4">Nhật Ký Hoạt Động</h1>
				<p class="text-muted fs-5">Xem lịch sử gửi tin nhắn qua Webhook Discord</p>
				<div class="d-flex flex-wrap justify-content-end align-items-center gap-2 mb-2">
					<div id="userInfo" class="d-flex flex-wrap justify-content-center justify-content-sm-end align-items-center gap-2">
						<span id="userEmail" class="text-truncate" style="max-width: 200px"></span>
						<div class="d-flex gap-2">
							<a href="SendDiscordMessage.html" class="btn btn-sm btn-outline-primary">
								<i class="fas fa-arrow-left d-none d-sm-inline me-1"></i>
								<span>Quay lại</span>
							</a>
							<button class="btn btn-sm btn-outline-danger" onclick="signOut()">
								<i class="fas fa-sign-out-alt d-none d-sm-inline me-1"></i>
								<span>Đăng xuất</span>
							</button>
						</div>
					</div>
				</div>
			</div>

			<div class="card mt-4">
				<div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
					<span>Nhật Ký Hoạt Động</span>
					<div class="d-flex gap-2">
						<button class="btn btn-sm btn-danger" onclick="downloadLogs()"><i class="fas fa-download"></i> <span class="d-none d-sm-inline">Tải log</span></button>
						<button class="btn btn-sm btn-danger" onclick="deleteLogs()"><i class="fas fa-trash"></i> <span class="d-none d-sm-inline">Xóa tất cả</span></button>
					</div>
				</div>
				<div class="card-body p-0">
					<div class="table-responsive">
						<table id="logsTable" class="table table-striped table-hover mb-0">
							<thead class="table-dark">
								<tr>
									<th class="text-center d-none d-sm-table-cell" style="width: 5%;">STT</th>
									<th class="d-none d-md-table-cell" style="width: 15%;">Thời gian</th>
									<th class="text-center" style="width: 4%;">KQ</th>
									<th class="d-none d-sm-table-cell" style="width: 12%;">Webhook</th>
									<th style="width: 60%;">Nội dung</th>
									<th class="text-center" style="width: 4%;"></th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<td colspan="6" class="text-center py-3">
										<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
				<div id="pagination" class="pb-3"></div>
			</div>

			<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
			<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
			<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
			<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

			<script>
				const VERSION = new Date().getTime();
				document.write(`<link rel="stylesheet" href="css/style.css?v=${VERSION}" />`);
				document.write(`
					<script src="../js/firebase-config.js?v=${VERSION}"><\/script>
					<script src="js/logs.js?v=${VERSION}"><\/script>
				`);
			</script>
		</div>
	</body>
</html>
