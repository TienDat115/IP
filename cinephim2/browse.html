<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Tìm Phim Nâng Cao - CinePhim</title>
		<meta name="description" content="Tìm phim theo thể loại và quốc gia kết hợp tại CinePhim" />
		<meta name="keywords" content="xem phim, phim online, tìm phim nâng cao, thể loại, quốc gia" />

		<!-- Favicon -->
		<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
		<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />

		<!-- Polyfills for Tizen 2014 -->
		<script src="js/polyfills.js"></script>
		<!-- Firebase SDK -->
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
		<script src="js/firebase-config.js"></script>

		<!-- SweetAlert2 -->
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

		<!-- Compat CSS for Tizen 2014 -->
		<link rel="stylesheet" href="css/compat.css" />
		<!-- Custom CSS -->
		<link rel="stylesheet" href="css/styles.css" />
	</head>

	<body class="home-body dark">
		<!-- Header -->
		<div id="siteHeader"></div>

		<!-- Breadcrumb -->
		<div class="container mx-auto px-4 pt-4">
			<nav id="breadcrumb" class="home-breadcrumb">
				<a href="index.html">Trang chủ</a>
				<i class="fas fa-chevron-right text-xs"></i>
				<span>Tìm phim nâng cao</span>
			</nav>
		</div>

		<!-- Main Content -->
		<main class="container mx-auto px-4 py-8">
			<!-- Page Title -->
			<div class="text-center mb-8">
				<h1 class="browse-title mb-4"><i class="fas fa-search mr-3"></i>Tìm phim nâng cao</h1>
				<p class="browse-subtitle max-w-2xl mx-auto">Kết hợp thể loại, quốc gia và năm để tìm phim chính xác hơn</p>
			</div>

			<!-- Filter Panel -->
			<div class="filter-panel mb-8">
				<div class="filter-header">
					<h3 class="filter-title"><i class="fas fa-filter"></i> Bộ lọc</h3>
					<button type="button" id="toggleFilterBtn" class="filter-toggle" aria-label="Thu nhỏ bộ lọc" aria-expanded="true">
						<i class="fas fa-chevron-up"></i>
					</button>
				</div>

				<div id="filterBody">
				<div class="filter-row">
					<span class="filter-label"><i class="fas fa-list mr-1"></i> Thể loại:</span>
					<div id="categoriesContainer" class="flex flex-wrap gap-2">
						<!-- Categories will be loaded dynamically -->
					</div>
				</div>

				<div class="filter-row">
					<span class="filter-label"><i class="fas fa-globe mr-1"></i> Quốc gia:</span>
					<div id="countriesContainer" class="flex flex-wrap gap-2">
						<!-- Countries will be loaded dynamically -->
					</div>
				</div>

				<div class="filter-row">
					<span class="filter-label"><i class="fas fa-calendar mr-1"></i> Năm:</span>
					<div id="yearsContainer" class="flex flex-wrap gap-2">
						<!-- Years will be loaded dynamically -->
					</div>
				</div>

				<div class="flex justify-center gap-3 sm:gap-4 mt-3 pt-3 border-t" style="border-color:var(--home-border)">
					<button id="applyFilterBtn" class="btn-apply">
						<i class="fas fa-search"></i> Lọc kết quả
					</button>
					<button id="clearFilterBtn" class="btn-clear">
						<i class="fas fa-times"></i> Đóng
					</button>
				</div>
				</div>
			</div>

			<!-- Filter Notice -->
			<div id="filterNotice" class="text-center text-sm text-gray-400 mb-4 hidden">
				<i class="fas fa-info-circle mr-1" style="color:var(--home-primary)"></i>
				<span id="filterNoticeText"></span>
			</div>

			<!-- Loading -->
			<div id="loading" class="text-center py-12 hidden">
				<div class="loading-spinner mx-auto"></div>
				<p class="mt-4">Đang tải danh sách phim...</p>
			</div>

			<!-- Movies Grid -->
			<div id="moviesContainer">
				<div id="moviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
					<!-- Movies will be loaded here -->
				</div>

				<!-- Pagination -->
				<div id="pagination" class="flex justify-center items-center space-x-2 mt-8">
					<!-- Pagination will be loaded here -->
				</div>
			</div>

			<!-- No Results Message -->
			<div id="noResults" class="text-center py-12 hidden">
				<i class="fas fa-film text-6xl text-gray-600 mb-4"></i>
				<h3 class="text-xl font-semibold mb-2">Không có phim nào</h3>
				<p class="text-gray-400">Thử thay đổi thể loại hoặc quốc gia để tìm được phim phù hợp.</p>
			</div>
		</main>

		<!-- Footer -->
		<div id="siteFooter"></div>

		<!-- Scripts -->
		<script src="js/config.js"></script>
		<script src="js/layout.js"></script>
		<script src="js/common.js"></script>
		<script src="js/browse.js"></script>

		<script>initPageSync();</script>

	</body>
</html>
