<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CinePhim - Xem Phim Online HD</title>
		<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
		<!-- Favicon -->
		<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
		<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
		<!-- Polyfills for Tizen 2014 -->
		<script src="js/polyfills.js"></script>
		<!-- Firebase SDK -->
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
		<script src="js/firebase-config.js"></script>
		<!-- SweetAlert2 -->
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
		<!-- Swiper -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
		<!-- Compat CSS for Tizen 2014 -->
		<link rel="stylesheet" href="css/compat.css" />
		<!-- Custom CSS -->
		<link rel="stylesheet" href="css/styles.css" />
	</head>

	<body class="home-body dark">
		<!-- Header -->
		<div id="siteHeader"></div>

		<!-- Main Content -->
		<main>
			<!-- Hero Slider -->
			<section id="heroSection" class="home-hero hidden">
				<div class="swiper top-slide-main" id="heroSlider">
					<div class="swiper-wrapper" id="heroWrapper"></div>
					<div class="swiper-pagination"></div>
				</div>
				<div class="home-hero-thumbs hidden xl:flex" id="heroThumbsWrap">
					<div id="heroThumbs"></div>
				</div>
			</section>

			<!-- Home Content (hero + rows) -->
			<div id="homeContent">
				<div id="homeRows" class="home-rows"></div>
			</div>

			<!-- Search Results -->
			<div id="searchResultsSection" class="container mx-auto px-4 py-8 hidden">
				<div class="mb-6">
					<h2 id="searchResultsTitle" class="text-2xl font-bold category-name">Kết quả tìm kiếm</h2>
				</div>
				<div id="moviesContainer">
					<div id="loading" class="text-center py-12 hidden">
						<div class="loading-spinner mx-auto"></div>
						<p class="mt-4">Đang tải...</p>
					</div>
					<div id="moviesGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
						<!-- Movies will be loaded here -->
					</div>
				</div>
				<div id="noResults" class="text-center py-12 hidden">
					<i class="fas fa-film text-6xl text-gray-600 mb-4"></i>
					<h3 class="text-xl font-semibold mb-2">Không có phim nào</h3>
					<p class="text-gray-400">Vui lòng thử lại sau.</p>
				</div>
				<div id="pagination" class="flex justify-center mt-6 md:mt-8 space-x-1 md:space-x-2"></div>
			</div>
		</main>

		<!-- Footer -->
		<div id="siteFooter"></div>

		<!-- Scripts -->
		<script src="js/config.js"></script>
		<script src="js/layout.js"></script>
		<script src="js/common.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
		<script src="js/index.js"></script>

		<script>initPageSync();</script>

	</body>
</html>
