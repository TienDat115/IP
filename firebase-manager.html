<!doctype html>
<html lang="vi">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Quản lý Firebase - CinePhim</title>
	<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
	<script src="js/firebase-config.js"></script>
	<script>const db = firebase.firestore();</script>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
	<style>
		:root { --bg-primary: #111827; --bg-secondary: #1f2937; --bg-card: #1f2937; --text-primary: #f9fafb; --text-secondary: #9ca3af; --accent: #7c3aed; --accent-hover: #6d28d9; --border: #374151; }
		body { font-family: system-ui, sans-serif; background: var(--bg-primary); color: var(--text-primary); }
		.collection-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
		.collection-card summary { cursor: pointer; padding: 14px 20px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; user-select: none; }
		.collection-card summary:hover { background: rgba(255,255,255,0.03); }
		.doc-row { display: flex; align-items: flex-start; gap: 8px; padding: 10px 20px; border-top: 1px solid var(--border); font-size: 13px; }
		.doc-row:hover { background: rgba(255,255,255,0.02); }
		.field-grid { flex: 1; display: flex; flex-wrap: wrap; gap: 4px 16px; }
		.field-item { display: flex; gap: 4px; min-width: 120px; }
		.field-key { color: var(--text-secondary); }
		.field-value { color: var(--text-primary); word-break: break-all; }
		.field-value.null { color: #6b7280; font-style: italic; }
		.doc-actions { display: flex; gap: 4px; flex-shrink: 0; }
		.doc-actions button { padding: 4px 8px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; transition: all 0.15s; }
		.btn-edit { background: #2563eb; color: #fff; }
		.btn-edit:hover { background: #1d4ed8; }
		.btn-delete { background: #dc2626; color: #fff; }
		.btn-delete:hover { background: #b91c1c; }
		.doc-id { color: #6b7280; font-size: 11px; font-family: monospace; margin-top: 2px; }
		.empty-msg { padding: 12px 20px; color: var(--text-secondary); font-size: 13px; border-top: 1px solid var(--border); }
		#statusBar { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 999; display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
		#statusBar.success { background: #065f46; color: #d1fae5; display: block; }
		#statusBar.error { background: #991b1b; color: #fee2e2; display: block; }
		#statusBar.info { background: #1e3a5f; color: #dbeafe; display: block; }
		summary::-webkit-details-marker { color: var(--text-secondary); }
		.count-badge { background: var(--accent); color: #fff; font-size: 11px; padding: 1px 10px; border-radius: 999px; margin-left: auto; }
		.refresh-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px 8px; border-radius: 6px; font-size: 13px; }
		.refresh-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.05); }
		.swal-input-custom { font-size: 14px !important; padding: 10px 12px !important; margin: 6px 0 !important; border-radius: 8px !important; background: #374151 !important; color: #fff !important; border: 1px solid #4b5563 !important; box-shadow: none !important; width: 100% !important; box-sizing: border-box !important; }
		.swal-input-custom:focus { border-color: #7c3aed !important; outline: none !important; }
		.swal-btn-custom { font-size: 14px !important; padding: 10px 28px !important; border-radius: 8px !important; }
		@media (max-width: 640px) { .doc-row { flex-direction: column; } .doc-actions { align-self: flex-end; } }
	</style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
	<header class="bg-gray-800 shadow-lg sticky top-0 z-50">
		<nav class="container mx-auto px-4 py-3 flex items-center justify-between">
			<a href="index.html" class="text-xl font-bold text-purple-400 hover:text-purple-300 transition"><i class="fas fa-database mr-2"></i>Quản lý Firebase</a>
			<div class="flex items-center gap-3">
				<span id="userStatus" class="text-sm text-gray-400">Chưa đăng nhập</span>
				<button id="loginBtn" onclick="login()" class="hidden bg-purple-600 hover:bg-purple-700 px-4 py-1.5 rounded-lg text-sm transition">Đăng nhập</button>
				<button id="logoutBtn" onclick="logout()" class="hidden bg-gray-700 hover:bg-gray-600 px-4 py-1.5 rounded-lg text-sm transition">Đăng xuất</button>
			</div>
		</nav>
	</header>
	<main class="container mx-auto px-4 py-6 max-w-5xl">
		<div id="mainContent">
			<div class="text-center py-20 text-gray-500">
				<i class="fas fa-sign-in-alt text-4xl mb-4"></i>
				<p>Vui lòng đăng nhập để quản lý dữ liệu Firebase.</p>
			</div>
		</div>
	</main>
	<div id="statusBar"></div>

	<script src="js/firebase-manager.js"></script>
</body>
</html>
