<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CinePhim - Xem Phim Online HD</title>
		<!-- Firebase SDK -->
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
		<script src="../js/firebase-config.js"></script>
		<!-- Tailwind CSS -->
		<script src="https://cdn.tailwindcss.com"></script>
		<!-- SweetAlert2 -->
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
		<style>
			.film-card {
				transition: all 0.3s ease;
			}
			.film-card:hover {
				transform: translateY(-5px);
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
			}
			.film-poster {
				aspect-ratio: 2/3;
				object-fit: cover;
			}
			.loading-spinner {
				border: 3px solid #f3f3f3;
				border-top: 3px solid #3498db;
				border-radius: 50%;
				width: 40px;
				height: 40px;
				animation: spin 1s linear infinite;
			}
			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}
			.gradient-bg {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			}
			.hero-section {
				background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><rect fill="%23667eea" width="1920" height="1080"/><polygon fill="%23764ba2" points="0,1080 1920,0 1920,1080"/></svg>');
				background-size: cover;
				background-position: center;
			}

			/* Light mode styles */
			body:not(.dark) {
				background-color: #f3f4f6;
				color: #111827;
			}
			body:not(.dark) .bg-gray-800 {
				background-color: #ffffff;
				color: #111827;
			}
			body:not(.dark) .bg-gray-700 {
				background-color: #f9fafb;
				color: #111827;
			}
			body:not(.dark) .bg-gray-900 {
				background-color: #f3f4f6;
				color: #111827;
			}
			body:not(.dark) .text-gray-400 {
				color: #6b7280;
			}
			body:not(.dark) .text-gray-300 {
				color: #4b5563;
			}
			body:not(.dark) .text-gray-500 {
				color: #6b7280;
			}
			body:not(.dark) .border-gray-600 {
				border-color: #d1d5db;
			}
			body:not(.dark) .border-gray-700 {
				border-color: #e5e7eb;
			}
			body:not(.dark) .hover\:bg-gray-700:hover {
				background-color: #f3f4f6;
			}
			body:not(.dark) .hover\:bg-gray-600:hover {
				background-color: #e5e7eb;
			}

			/* Mobile responsive improvements */
			@media (max-width: 640px) {
				.hero-section h2 {
					font-size: 2rem;
				}
				.hero-section p {
					font-size: 1rem;
				}
				.hero-section .flex {
					flex-direction: column;
					gap: 1rem;
				}
				.hero-section button {
					width: 100%;
				}
				header .flex {
					flex-direction: column;
					gap: 1rem;
				}
				header .search-bar {
					order: 3;
					width: 100%;
				}
				header nav {
					flex-direction: column;
				}
				header .items-center {
					justify-content: center;
					flex-wrap: wrap;
				}
				header .space-x-6 > * {
					margin: 0.25rem;
				}
			}

			@media (max-width: 768px) {
				#movieModal .max-w-4xl {
					max-width: 95vw;
					margin: 1rem;
				}
			}
		</style>
	</head>
	<body class="bg-gray-900 text-white">
		<!-- Header -->
		<header class="bg-gray-800 shadow-lg sticky top-0 z-50">
			<nav class="container mx-auto px-4 py-4">
				<div class="flex items-center justify-between">
					<div class="flex items-center space-x-4">
						<h1 class="text-2xl font-bold text-purple-400"><i class="fas fa-film mr-2"></i>CinePhim</h1>
					</div>

					<!-- Search Bar -->
					<div class="flex-1 max-w-md mx-8 search-bar">
						<div class="relative">
							<input type="text" id="searchInput" placeholder="Tìm kiếm phim..." class="w-full px-4 py-2 pl-10 pr-4 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-purple-400 text-white" />
							<i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
						</div>
					</div>

					<!-- Navigation -->
					<div class="flex items-center space-x-6">
						<button onclick="showHome()" class="hover:text-purple-400 transition"><i class="fas fa-home mr-1"></i>Trang chủ</button>
						<button onclick="showNowPlaying()" class="hover:text-purple-400 transition"><i class="fas fa-film mr-1"></i>Đang chiếu</button>
						<button onclick="showCategories()" class="hover:text-purple-400 transition"><i class="fas fa-th-large mr-1"></i>Thể loại</button>
						<button onclick="showCountries()" class="hover:text-purple-400 transition"><i class="fas fa-globe mr-1"></i>Quốc gia</button>
						<button onclick="showYears()" class="hover:text-purple-400 transition"><i class="fas fa-calendar mr-1"></i>Năm</button>
						<button onclick="showFavorites()" class="hover:text-purple-400 transition"><i class="fas fa-heart mr-1"></i>Yêu thích</button>
						<button onclick="toggleTheme()" class="hover:text-purple-400 transition">
							<i id="themeIcon" class="fas fa-moon mr-1"></i>
						</button>
						<button onclick="toggleLogin()" class="hover:text-purple-400 transition">
							<i id="loginIcon" class="fas fa-sign-in-alt mr-1"></i>
							<span id="loginText">Đăng nhập</span>
						</button>
					</div>
				</div>
			</nav>
		</header>

		<!-- Hero Section -->
		<section class="hero-section py-20">
			<div class="container mx-auto px-4 text-center">
				<h2 class="text-5xl font-bold mb-4">Xem Phim Online HD Miễn Phí</h2>
				<p class="text-xl mb-8">Thư viện phim khổng lồ với chất lượng Full HD</p>
				<div class="flex justify-center space-x-4">
					<button onclick="loadNewMovies()" class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-lg font-semibold transition"><i class="fas fa-play mr-2"></i>Phim mới cập nhật</button>
					<button onclick="showCategories()" class="bg-gray-700 hover:bg-gray-600 px-6 py-3 rounded-lg font-semibold transition"><i class="fas fa-list mr-2"></i>Khám phá</button>
				</div>
			</div>
		</section>

		<!-- Main Content -->
		<main class="container mx-auto px-4 py-8">
			<!-- Loading -->
			<div id="loading" class="text-center py-12 hidden">
				<div class="loading-spinner mx-auto"></div>
				<p class="mt-4">Đang tải...</p>
			</div>

			<!-- Movies Grid -->
			<div id="moviesContainer" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
				<!-- Movies will be loaded here -->
			</div>

			<!-- Pagination -->
			<div id="pagination" class="flex justify-center mt-8 space-x-2">
				<!-- Pagination will be loaded here -->
			</div>

			<!-- Categories Section (Hidden by default) -->
			<div id="categoriesSection" class="hidden">
				<h3 class="text-2xl font-bold mb-6">Thể loại phim</h3>
				<div id="categoriesGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
					<!-- Categories will be loaded here -->
				</div>
			</div>

			<!-- Countries Section (Hidden by default) -->
			<div id="countriesSection" class="hidden">
				<h3 class="text-2xl font-bold mb-6">Quốc gia</h3>
				<div id="countriesGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
					<!-- Countries will be loaded here -->
				</div>
			</div>

			<!-- Years Section (Hidden by default) -->
			<div id="yearsSection" class="hidden">
				<h3 class="text-2xl font-bold mb-6">Năm phát hành</h3>
				<div id="yearsGrid" class="grid grid-cols-3 md:grid-cols-6 lg:grid-cols-8 gap-3">
					<!-- Years will be loaded here -->
				</div>
			</div>

			<!-- Favorites Section (Hidden by default) -->
			<div id="favoritesSection" class="hidden">
				<h3 class="text-2xl font-bold mb-6">Phim yêu thích</h3>
				<div id="favoritesGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
					<!-- Favorite movies will be loaded here -->
				</div>
			</div>
		</main>

		<!-- Movie Detail Modal -->
		<div id="movieModal" class="fixed inset-0 bg-black bg-opacity-75 z-50 hidden">
			<div class="flex items-center justify-center min-h-screen p-4">
				<div class="bg-gray-800 rounded-lg max-w-4xl w-full max-h-[90vh] overflow-y-auto">
					<div class="relative">
						<button onclick="closeMovieModal()" class="absolute top-4 right-4 text-white text-2xl hover:text-red-400 z-10">
							<i class="fas fa-times"></i>
						</button>
						<div id="movieDetailContent">
							<!-- Movie details will be loaded here -->
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Login Modal -->
		<div id="loginModal" class="fixed inset-0 bg-black bg-opacity-75 z-50 hidden">
			<div class="flex items-center justify-center min-h-screen p-4">
				<div class="bg-gray-800 rounded-lg max-w-md w-full p-6">
					<div class="flex justify-between items-center mb-4">
						<h3 class="text-xl font-semibold text-white">Đăng nhập</h3>
						<button onclick="closeLoginModal()" class="text-gray-400 hover:text-white">
							<i class="fas fa-times"></i>
						</button>
					</div>
					<form onsubmit="handleLogin(event)">
						<div class="mb-4">
							<label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
							<input type="email" id="loginEmail" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-purple-400" placeholder="nhập email của bạn" />
						</div>
						<div class="mb-6">
							<label class="block text-sm font-medium text-gray-300 mb-2">Mật khẩu</label>
							<input type="password" id="loginPassword" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-purple-400" placeholder="nhập mật khẩu" />
						</div>
						<button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-4 rounded-lg transition">Đăng nhập</button>
					</form>
					<div class="mt-4 text-center">
						<p class="text-sm text-gray-400">
							Chưa có tài khoản?
							<button onclick="showRegisterModal()" class="text-purple-400 hover:text-purple-300">Đăng ký</button>
						</p>
					</div>
				</div>
			</div>
		</div>

		<!-- Register Modal -->
		<div id="registerModal" class="fixed inset-0 bg-black bg-opacity-75 z-50 hidden">
			<div class="flex items-center justify-center min-h-screen p-4">
				<div class="bg-gray-800 rounded-lg max-w-md w-full p-6">
					<div class="flex justify-between items-center mb-4">
						<h3 class="text-xl font-semibold text-white">Đăng ký</h3>
						<button onclick="closeRegisterModal()" class="text-gray-400 hover:text-white">
							<i class="fas fa-times"></i>
						</button>
					</div>
					<form onsubmit="handleRegister(event)">
						<div class="mb-4">
							<label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
							<input type="email" id="registerEmail" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-purple-400" placeholder="nhập email của bạn" />
						</div>
						<div class="mb-4">
							<label class="block text-sm font-medium text-gray-300 mb-2">Mật khẩu</label>
							<input type="password" id="registerPassword" required minlength="6" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-purple-400" placeholder="tối thiểu 6 ký tự" />
						</div>
						<div class="mb-6">
							<label class="block text-sm font-medium text-gray-300 mb-2">Xác nhận mật khẩu</label>
							<input type="password" id="registerConfirmPassword" required minlength="6" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-purple-400" placeholder="nhập lại mật khẩu" />
						</div>
						<button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-4 rounded-lg transition">Đăng ký</button>
					</form>
					<div class="mt-4 text-center">
						<p class="text-sm text-gray-400">
							Đã có tài khoản?
							<button onclick="showLoginModal()" class="text-purple-400 hover:text-purple-300">Đăng nhập</button>
						</p>
					</div>
				</div>
			</div>
		</div>

		<!-- Footer -->
		<footer class="bg-gray-800 py-8 mt-16">
			<div class="container mx-auto px-4 text-center">
				<p class="text-gray-400">2024 CinePhim. Xem phim online miễn phí với chất lượng HD.</p>
			</div>
		</footer>

		<script src="app.js"></script>
	</body>
</html>
