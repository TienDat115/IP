<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/x-icon" href="https://img.icons8.com/ios/50/000000/user-male-circle.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Đăng Nhập - Gửi Tin Nhắn</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
		<!-- Firebase SDK -->
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>

		<!-- Firebase configuration -->
		<script src="js/firebase-config.js"></script>
		<style>
			/* Your existing styles remain unchanged */
			body {
				background-color: #f8f9fa;
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				margin: 0;
				padding: 20px;
			}
			.container {
				max-width: 400px;
			}
			.card {
				border-radius: 10px;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
				border: none;
			}
			.card-header {
				background-color: #0088cc;
				color: white;
				font-weight: bold;
				padding: 12px 20px;
				border-radius: 10px 10px 0 0;
				text-align: center;
			}
			.card-body {
				padding: 30px;
			}
			.btn-primary {
				background-color: #0088cc;
				border: none;
				padding: 10px;
				width: 100%;
				font-weight: 500;
			}
			.btn-primary:hover {
				background-color: #006699;
			}
			.form-label {
				font-weight: 500;
				margin-bottom: 8px;
			}
			.form-control:focus {
				border-color: #86b7fe;
				box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
			}
			.text-error {
				color: #721c24;
				font-size: 0.9em;
				margin-top: 5px;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="card">
				<div class="card-header">
					<h4 class="mb-0">Đăng Nhập</h4>
				</div>
				<div class="card-body">
					<form id="loginForm">
						<div class="mb-3">
							<label for="email" class="form-label">Email</label>
							<input type="email" class="form-control" id="email" placeholder="Nhập email của bạn" required />
						</div>
						<div class="mb-3">
							<label for="password" class="form-label">Mật khẩu</label>
							<input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required />
						</div>
						<div id="errorMessage" class="text-error"></div>
						<button type="submit" class="btn btn-primary mt-3">
							<span class="spinner-border spinner-border-sm d-none" id="loginSpinner" role="status" aria-hidden="true"></span>
							Đăng nhập
						</button>
					</form>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
		<script>
			// Initialize Firebase
			firebase.initializeApp(firebaseConfig);
			const auth = firebase.auth();

			// Handle form submission for email/password login
			document.getElementById("loginForm").addEventListener("submit", async function (event) {
				event.preventDefault();

				const email = document.getElementById("email").value;
				const password = document.getElementById("password").value;
				const loginButton = document.querySelector("#loginForm button");
				const spinner = document.getElementById("loginSpinner");
				const errorMessage = document.getElementById("errorMessage");

				loginButton.disabled = true;
				spinner.classList.remove("d-none");
				errorMessage.textContent = "";

				try {
					await auth.signInWithEmailAndPassword(email, password);
					Swal.fire({
						icon: "success",
						title: "Đăng nhập thành công",
						toast: true,
						position: "top-end",
						showConfirmButton: false,
						timer: 2000,
						timerProgressBar: true,
					}).then(() => {
						window.location.href = "index.html"; // Consistent redirect
					});
				} catch (error) {
					console.error("Lỗi đăng nhập:", error);
					errorMessage.textContent = getFriendlyErrorMessage(error.code);
					Swal.fire({
						icon: "error",
						title: "Lỗi",
						text: getFriendlyErrorMessage(error.code),
						toast: true,
						position: "top-end",
						showConfirmButton: false,
						timer: 3000,
						timerProgressBar: true,
					});
				} finally {
					loginButton.disabled = false;
					spinner.classList.add("d-none");
				}
			});

			// Convert Firebase error codes to user-friendly messages
			function getFriendlyErrorMessage(errorCode) {
				switch (errorCode) {
					case "auth/invalid-email":
						return "Email không hợp lệ.";
					case "auth/user-disabled":
						return "Tài khoản đã bị vô hiệu hóa.";
					case "auth/user-not-found":
						return "Không tìm thấy tài khoản với email này.";
					case "auth/wrong-password":
						return "Mật khẩu không đúng.";
					case "auth/too-many-requests":
						return "Quá nhiều lần thử đăng nhập. Vui lòng thử lại sau.";
					case "auth/network-request-failed":
						return "Lỗi kết nối mạng. Vui lòng kiểm tra kết nối và thử lại.";
					default:
						return "Đã xảy ra lỗi. Vui lòng thử lại.";
				}
			}

			// Check auth state and redirect if already logged in
			auth.onAuthStateChanged((user) => {
				if (user) {
					window.location.href = "index.html"; // Consistent redirect
				}
			});
		</script>
	</body>
</html>
