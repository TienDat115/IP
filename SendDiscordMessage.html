<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/x-icon" href="https://images-eds-ssl.xboxlive.com/image?url=4rt9.lXDC4H_93laV1_eHHFT949fUipzkiFOBH3fAiZZUCdYojwUyX2aTonS1aIwMrx6NUIsHfUHSLzjGJFxxsG72wAo9EWJR4yQWyJJaDaK1XdUso6cUMpI9hAdPUU_FNs11cY1X284vsHrnWtRw7oqRpN1m9YAg21d_aNKnIo-&format=source" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Gửi Tin Nhắn Discord</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
		<style>
			body {
				background-color: #f8f9fa;
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			}
			.container {
				max-width: 800px;
				margin-top: 30px;
			}
			.card {
				border-radius: 10px;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
				margin-bottom: 20px;
			}
			.card-header {
				background-color: #5865f2;
				color: white;
				font-weight: bold;
				border-radius: 10px 10px 0 0 !important;
			}
			.btn-primary {
				background-color: #5865f2;
				border: none;
			}
			.btn-primary:hover {
				background-color: #4752c4;
			}
			.webhook-item {
				cursor: pointer;
				padding: 10px;
				border-radius: 5px;
				margin-bottom: 5px;
				transition: all 0.2s;
			}
			.webhook-item:hover {
				background-color: #f1f1f1;
			}
			.webhook-item.highlight {
				background-color: #e9f7fe;
				border-left: 4px solid #2196f3;
			}
			.divider {
				border-top: 2px solid #e0e0e0;
				margin: 10px 0;
			}
			.emoji-btn {
				font-size: 1.2em;
				cursor: pointer;
				margin: 0 5px;
				transition: transform 0.2s;
			}
			.emoji-btn:hover {
				transform: scale(1.2);
			}
			.emoji-btn-container {
				margin-top: 10px;
				background-color: #f8f9fa;
				padding: 5px;
				border: 1px solid #ddd;
				border-radius: 5px;
			}

			/* CSS cho tab navigation */
			.nav-tabs {
				border-bottom: 1px solid #dee2e6;
				overflow-x: auto;
				white-space: nowrap;
				padding: 0 10px;
				margin-bottom: 15px;
			}
			.nav-tabs .nav-link {
				padding: 0.5rem 1rem;
				margin-right: 0.5rem;
				border: 1px solid transparent;
				border-radius: 4px 4px 0 0;
			}
			.nav-tabs .nav-link.active {
				border-bottom-color: #dee2e6;
			}
			/* Ẩn thanh cuộn dọc của vùng chứa tab */
			.nav-tabs,
			.tab-content {
				overflow-y: hidden !important;
			}
			/* Responsive adjustments */
			@media (max-width: 768px) {
				.nav-tabs {
					overflow-x: auto;
					white-space: nowrap;
					padding: 0 5px;
				}
				.nav-tabs .nav-link {
					padding: 0.3rem 0.8rem;
					margin-right: 0.3rem;
					font-size: 0.9rem;
				}
			}

			/* Dark Mode styles */
			body.dark-mode {
				background-color: #1a1a1a;
				color: #ffffff;
			}

			.dark-mode .container {
				background-color: #2d2d2d;
				border-radius: 10px;
			}

			.dark-mode .card {
				background-color: #2d2d2d;
				border-color: #3d3d3d;
			}

			.dark-mode .card-header {
				background-color: #3d3d3d;
				border-bottom-color: #4d4d4d;
			}

			.dark-mode .form-control,
			.dark-mode .form-select,
			.dark-mode .form-check-input {
				background-color: #3d3d3d;
				border-color: #4d4d4d;
				color: #ffffff;
			}

			.dark-mode .form-control:focus,
			.dark-mode .form-select:focus {
				border-color: #5865f2;
				box-shadow: 0 0 0 0.25rem rgba(88, 101, 242, 0.25);
			}

			.dark-mode .btn-primary {
				background-color: #5865f2;
				border-color: #5865f2;
			}

			.dark-mode .btn-primary:hover {
				background-color: #4752c4;
				border-color: #4752c4;
			}

			.dark-mode .btn-secondary {
				background-color: #4d4d4d;
				border-color: #4d4d4d;
			}

			.dark-mode .btn-secondary:hover {
				background-color: #5d5d5d;
				border-color: #5d5d5d;
			}

			.dark-mode .nav-tabs .nav-link {
				color: #ffffff;
			}

			.dark-mode .nav-tabs .nav-link.active {
				background-color: #3d3d3d;
				border-bottom-color: #5865f2;
			}

			.dark-mode .emoji-btn {
				background-color: #3d3d3d;
			}

			.dark-mode .emoji-btn:hover {
				background-color: #4d4d4d;
			}

			.dark-mode .emoji-btn-container {
				background-color: #3d3d3d;
				border-color: #4d4d4d;
			}

			.dark-mode .embed-field {
				background-color: #3d3d3d;
				border-color: #4d4d4d;
			}

			.dark-mode .embed-field input,
			.dark-mode .embed-field textarea {
				background-color: #3d3d3d;
				border-color: #4d4d4d;
			}

			.dark-mode .embed-field input:focus,
			.dark-mode .embed-field textarea:focus {
				border-color: #5865f2;
				box-shadow: 0 0 0 0.25rem rgba(88, 101, 242, 0.25);
			}

			.dark-mode .embed-field .btn-danger {
				background-color: #dc3545;
				border-color: #dc3545;
			}

			.dark-mode .embed-field .btn-danger:hover {
				background-color: #c82333;
				border-color: #bd2130;
			}

			.dark-mode .logArea {
				background-color: #3d3d3d;
				color: #ffffff;
			}

			.dark-mode .logArea .text-danger {
				color: #dc3545;
			}

			.title-container {
				animation: fadeInDown 0.8s ease-out;
			}

			.text-gradient {
				background: linear-gradient(45deg, #4361ee, #3f37c9, #4895ef);
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
			}

			@keyframes fadeInDown {
				from {
					opacity: 0;
					transform: translateY(-20px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}
		</style>
	</head>
	<body>
		<!-- Modal Đăng nhập -->
		<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Đăng nhập hệ thống</h5>
					</div>
					<div class="modal-body">
						<div id="loginAlert" class="alert alert-danger d-none"></div>
						<div class="mb-3">
							<label for="username" class="form-label">Email</label>
							<input type="email" class="form-control" id="username" required />
						</div>
						<div class="mb-3">
							<label for="password" class="form-label">Mật khẩu</label>
							<input type="password" class="form-control" id="password" required />
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-primary" id="btnLogin">Đăng nhập</button>
					</div>
				</div>
			</div>
		</div>

		<div class="container d-none">
			<div class="text-center mb-4">
				<div class="title-container">
					<h1 class="display-5 fw-bold text-gradient mb-3">Gửi Tin Nhắn Discord</h1>
					<p class="text-muted fs-5">Công cụ gửi tin nhắn qua Webhook Discord</p>
				</div>
			</div>

			<div class="card mb-4">
				<div class="card-header">Cấu Hình Webhook</div>
				<div class="card-body">
					<div class="mb-3">
						<label class="form-label">Chọn Webhook:</label>
						<select id="webhookSelect" class="form-select">
							<option value="1">[JXM] Võ Lâm Xích Hỏa - Hệ Thống</option>
							<option value="2">[JXM] Võ Lâm Xích Hỏa - Thảo Luận</option>
							<option value="3">[JXM] Võ Lâm Tây Vực - Hệ Thống</option>
							<option value="4">[JXM] Võ Lâm Tây Vực - Thảo Luận</option>
							<option value="5">[JXM] Võ Lâm Tây Vực - File Bảo Trì</option>
							<option value="6">TEST</option>
							<option value="7">[JXM] Võ Lâm Hồng Kông - Hệ Thống</option>
							<option value="8">[JXM] Võ Lâm Hồng Kông - Thảo Luận</option>
							<option value="9">[JXM] Võ Lâm Hồng Kông - File Bảo Trì</option>
						</select>
					</div>
					<div class="mb-3">
						<label class="form-label">Tùy chỉnh tên người gửi (tùy chọn):</label>
						<input type="text" id="customUsername" class="form-control" placeholder="Để trống để sử dụng tên mặc định" />
					</div>
					<div class="mb-3">
						<label class="form-label">Avatar URL (tùy chọn):</label>
						<input type="text" id="avatarUrl" class="form-control" placeholder="URL hình đại diện" />
					</div>
				</div>
			</div>

			<div class="card mb-4">
				<div class="card-header">Nội Dung Tin Nhắn</div>
				<div class="card-body">
					<ul class="nav nav-tabs mb-3" id="messageTabs" role="tablist">
						<li class="nav-item" role="presentation">
							<button class="nav-link active" id="text-tab" data-bs-toggle="tab" data-bs-target="#text" type="button" role="tab">Văn Bản</button>
						</li>
						<li class="nav-item" role="presentation">
							<button class="nav-link" id="file-tab" data-bs-toggle="tab" data-bs-target="#file" type="button" role="tab">Gửi File</button>
						</li>
						<li class="nav-item" role="presentation">
							<button class="nav-link" id="embed-tab" data-bs-toggle="tab" data-bs-target="#embed" type="button" role="tab">Tin Nhúng</button>
						</li>
					</ul>

					<div class="tab-content" id="messageTabsContent">
						<!-- Tab Văn Bản -->
						<div class="tab-pane fade show active" id="text" role="tabpanel">
							<div class="mb-3">
								<label class="form-label">Nội dung tin nhắn:</label>
								<div class="mb-2">
									<select id="templateSelect" class="form-select form-select-sm" style="width: 200px; display: inline-block" onchange="applyTemplate(this.value)">
										<option value="">-- Chọn mẫu tin nhắn --</option>
										<option value="rollback_thất_bại">Rollback Thất Bại</option>
										<option value="thong_bao">Thông báo</option>
										<option value="canh_bao">Thắc Mắc</option>
										<option value="ip">Bỏ Giới Hạn IP</option>
										<option value="bao_tri">Bảo Trì</option>
									</select>
								</div>
								<textarea class="form-control" id="messageText" rows="10" placeholder="Nhập nội dung tin nhắn..."></textarea>
								<div class="mt-2 emoji-btn-container">
									<span class="emoji-btn" title="In đậm" onclick="insertText('**', '**')">B</span>
									<span class="emoji-btn" title="In nghiêng" onclick="insertText('*', '*')">I</span>
									<span class="emoji-btn" title="Gạch dưới" onclick="insertText('__', '__')">U̲</span>
									<span class="emoji-btn" title="Gạch ngang" onclick="insertText('~~', '~~')">S̶</span>
									<span class="emoji-btn" title="Thời gian" onclick="insertText('', getCurrentTime())">🕒</span>
								</div>
							</div>
							<div class="form-check mb-3">
								<input class="form-check-input" type="checkbox" id="tts" />
								<label class="form-check-label" for="tts">Đọc to (Text-to-Speech)</label>
							</div>
							<div class="d-flex gap-2">
								<button class="btn btn-primary" onclick="sendTextMessage()">Gửi Tin Nhắn</button>
								<button class="btn btn-primary" onclick="scheduleMessage('text')">Hẹn giờ</button>
							</div>
						</div>

						<!-- Tab File Đính Kèm -->
						<div class="tab-pane fade" id="file" role="tabpanel">
							<div class="mb-3">
								<label class="form-label">Chọn file đính kèm:</label>
								<input type="file" class="form-control" id="fileInput" multiple />
							</div>
							<div class="mb-3">
								<label class="form-label">Nội dung kèm theo (tùy chọn):</label>
								<textarea class="form-control" id="fileMessage" rows="3" placeholder="Nhập nội dung kèm theo file..."></textarea>
							</div>
							<div class="d-flex gap-2">
								<button class="btn btn-primary" onclick="sendFileMessage()">Gửi File</button>
								<button class="btn btn-primary" onclick="scheduleMessage('file')">Hẹn giờ</button>
							</div>
						</div>

						<!-- Tab Tin Nhúng -->
						<div class="tab-pane fade" id="embed" role="tabpanel">
							<div class="mb-3">
								<label class="form-label">Tiêu đề:</label>
								<input type="text" class="form-control" id="embedTitle" placeholder="Nhập tiêu đề" />
							</div>
							<div class="mb-3">
								<label class="form-label">Mô tả:</label>
								<textarea class="form-control" id="embedDescription" rows="3" placeholder="Nhập mô tả"></textarea>
							</div>
							<div class="mb-3">
								<label class="form-label">Màu sắc:</label>
								<div class="d-flex gap-2">
									<input type="color" class="form-control form-control-color" id="embedColorPicker" value="#5865F2" title="Chọn màu" style="height: 38px; padding: 0; cursor: pointer" />
									<input type="text" class="form-control" id="embedColor" value="5865F2" placeholder="VD: 5865F2 (màu xanh Discord)" readonly />
								</div>
							</div>
							<div id="embedFields">
								<div class="embed-field mb-3 p-2 border rounded">
									<div class="d-flex justify-content-between mb-2">
										<h6>Trường 1</h6>
										<button class="btn btn-sm btn-danger" onclick="removeEmbedField(this)">Xóa</button>
									</div>
									<input type="text" class="form-control mb-2" placeholder="Tên trường" />
									<textarea class="form-control mb-2" placeholder="Giá trị"></textarea>
									<div class="form-check">
										<input class="form-check-input" type="checkbox" />
										<label class="form-check-label">Hiển thị cùng dòng</label>
									</div>
								</div>
							</div>
							<button class="btn btn-secondary mb-3" onclick="addEmbedField()">+ Thêm Trường</button>
							<div class="mb-3">
								<label class="form-label">Chân trang:</label>
								<input type="text" class="form-control" id="embedFooter" placeholder="Nhập chân trang" />
							</div>
							<div class="d-flex gap-2">
								<button class="btn btn-primary" onclick="sendEmbedMessage()">Gửi Tin Nhúng</button>
								<button class="btn btn-primary" onclick="scheduleMessage('embed')">Hẹn giờ</button>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="card">
				<div class="card-header">Nhật Ký Hoạt Động</div>
				<div class="card-body">
					<div id="logArea" class="bg-light p-3" style="min-height: 100px; max-height: 200px; overflow-y: auto; border-radius: 5px; font-family: monospace">
						<div>Hệ thống đã sẵn sàng. Chọn các tùy chọn và gửi tin nhắn.</div>
					</div>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
		<!-- Thêm Firebase SDK -->
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
		<script>
			// Khởi tạo Firebase
			const firebaseConfig = {
				apiKey: "AIzaSyA0lOPK7ngRqblR6osPdUyGeoH9uUEQNo8",
				authDomain: "discordwebhooks-c3158.firebaseapp.com",
				projectId: "discordwebhooks-c3158",
				storageBucket: "discordwebhooks-c3158.firebasestorage.app",
				messagingSenderId: "75120159974",
				appId: "1:75120159974:web:bd9bee21fd8639b25d9f27",
				measurementId: "G-H06TGKVTP8",
			};

			// Khởi tạo Firebase
			firebase.initializeApp(firebaseConfig);
			const auth = firebase.auth();
			const db = firebase.firestore();

			// Hiển thị modal đăng nhập khi trang tải xong
			document.addEventListener("DOMContentLoaded", function () {
				// Xóa session và token khi trang tải
				auth.signOut().catch((error) => {
					console.error("Lỗi khi xóa session:", error);
				});

				const loginModal = new bootstrap.Modal(document.getElementById("loginModal"));
				loginModal.show();

				// Xử lý sự kiện đăng nhập
				document.getElementById("btnLogin").addEventListener("click", loginUser);

				// Kiểm tra trạng thái đăng nhập
				auth.onAuthStateChanged((user) => {
					if (user) {
						// Người dùng đã đăng nhập
						loginModal.hide();
						document.querySelector(".container").classList.remove("d-none");
						// Load dữ liệu sau khi đăng nhập
						loadWebhooks();
					} else {
						// Chưa đăng nhập
						document.querySelector(".container").classList.add("d-none");
						// Hiển thị lại modal đăng nhập nếu bị đóng
						loginModal.show();
					}
				});
			});

			// Hàm đăng nhập
			async function loginUser() {
				const email = document.getElementById("username").value;
				const password = document.getElementById("password").value;

				try {
					await auth.signInWithEmailAndPassword(email, password);

					// Thông báo đăng nhập thành công
					await Swal.fire({
						icon: "success",
						title: "Đăng nhập thành công!",
						showConfirmButton: true,
						confirmButtonText: "OK",
						allowOutsideClick: false,
					});

					// Ẩn cảnh báo lỗi nếu có
					const loginAlert = document.getElementById("loginAlert");
					if (loginAlert) {
						loginAlert.classList.add("d-none");
					}
				} catch (error) {
					// Thông báo lỗi đăng nhập
					await Swal.fire({
						icon: "error",
						title: "Đăng nhập thất bại",
						text: error.message,
						confirmButtonText: "Thử lại",
						confirmButtonColor: "#dc3545",
					});

					// Focus lại vào trường email
					document.getElementById("username").focus();
				}
			}

			// Hàm tải webhooks (chỉ gọi sau khi đăng nhập thành công)
			async function loadWebhooks() {
				try {
					const webhooks = {};
					const querySnapshot = await db.collection("webhooks").get();
					querySnapshot.forEach((doc) => {
						const data = doc.data();
						webhooks[data.id] = data.url;
					});
					// Cập nhật giao diện với danh sách webhooks
					updateWebhookUI(webhooks);
				} catch (error) {
					console.error("Lỗi khi lấy webhooks:", error);
				}
			}

			// Hàm cập nhật giao diện với danh sách webhooks
			function updateWebhookUI(webhooks) {
				// Thêm code cập nhật giao diện ở đây
			}

			// Hàm lấy webhook URLs từ Firebase
			async function getWebhookUrls() {
				try {
					const webhooks = {};
					const querySnapshot = await db.collection("webhooks").get();
					querySnapshot.forEach((doc) => {
						const data = doc.data();
						webhooks[data.id] = data.url;
					});
					return webhooks;
				} catch (error) {
					console.error("Lỗi khi lấy webhooks:", error);
					return {};
				}
			}

			// Thêm log vào khung nhật ký
			function addLog(message, isError = false) {
				const logArea = document.getElementById("logArea");
				const logEntry = document.createElement("div");
				const timestamp = new Date().toLocaleTimeString();

				logEntry.innerHTML = `<span class="text-muted">[${timestamp}]</span> ${message}`;
				if (isError) {
					logEntry.className = "text-danger";
				}

				logArea.prepend(logEntry);

				// Giới hạn số lượng log hiển thị
				if (logArea.children.length > 50) {
					logArea.removeChild(logArea.lastChild);
				}
			}

			// Chèn văn bản vào textarea
			function insertText(before, after) {
				const textarea = document.getElementById("messageText");
				const start = textarea.selectionStart;
				const end = textarea.selectionEnd;
				const text = textarea.value;
				const selectedText = text.substring(start, end);

				textarea.value = text.substring(0, start) + before + selectedText + after + text.substring(end);

				// Đặt lại vị trí con trỏ
				const newCursorPos = start + before.length;
				textarea.setSelectionRange(newCursorPos, newCursorPos + selectedText.length);
				textarea.focus();
			}

			// Lấy thởi gian hiện tại
			function getCurrentTime() {
				const now = new Date();
				const year = now.getFullYear();
				const month = String(now.getMonth() + 1).padStart(2, "0");
				const day = String(now.getDate()).padStart(2, "0");
				const hours = String(now.getHours()).padStart(2, "0");
				const minutes = String(now.getMinutes()).padStart(2, "0");
				const seconds = String(now.getSeconds()).padStart(2, "0");

				return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
			}

			// Gửi tin nhắn văn bản
			async function sendTextMessage() {
				const webhooks = await getWebhookUrls();
				const selectedWebhookId = document.getElementById("webhookSelect").value;
				const webhookUrl = webhooks[selectedWebhookId];
				const message = document.getElementById("messageText").value;
				const username = document.getElementById("customUsername").value;
				const avatarUrl = document.getElementById("avatarUrl").value;
				const tts = document.getElementById("tts").checked;

				if (!message.trim()) {
					addLog("❌ Vui lòng nhập nội dung tin nhắn", true);
					return;
				}

				const payload = {
					content: message,
					tts: tts,
				};

				if (username) payload.username = username;
				if (avatarUrl) payload.avatar_url = avatarUrl;

				try {
					const response = await fetch(webhookUrl, {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
						},
						body: JSON.stringify(payload),
					});

					if (response.ok) {
						addLog("✅ Đã gửi tin nhắn thành công!");
						// Hiển thị thông báo thành công
						await Swal.fire({
							icon: "success",
							title: "Thành công!",
							text: "Tin nhắn đã được gửi thành công.",
							showConfirmButton: true,
						});
					} else {
						const error = await response.text();
						addLog(`❌ Lỗi khi gửi tin nhắn: ${error}`, true);
						await Swal.fire({
							icon: "error",
							title: "Lỗi!",
							text: "Đã xảy ra lỗi khi gửi tin nhắn: " + error.message,
						});
					}
				} catch (error) {
					addLog(`❌ Lỗi kết nối: ${error.message}`, true);
					await Swal.fire({
						icon: "error",
						title: "Lỗi!",
						text: "Đã xảy ra lỗi khi gửi tin nhắn: " + error.message,
					});
				}
			}

			// Gửi file đính kèm
			async function sendFileMessage() {
				try {
					const webhooks = await getWebhookUrls();
					const selectedWebhookId = document.getElementById("webhookSelect").value;
					const webhookUrl = webhooks[selectedWebhookId];
					const fileInput = document.getElementById("fileInput");
					const files = fileInput.files;
					const message = document.getElementById("fileMessage").value;
					const username = document.getElementById("customUsername").value;
					const avatarUrl = document.getElementById("avatarUrl").value;

					if (files.length === 0) {
						addLog("❌ Vui lòng chọn ít nhất một file", true);
						return;
					}

					const formData = new FormData();
					if (message) formData.append("content", message);
					if (username) formData.append("username", username);
					if (avatarUrl) formData.append("avatar_url", avatarUrl);

					// Thêm tất cả các file đã chọn
					for (let i = 0; i < files.length; i++) {
						formData.append(`file${i}`, files[i]);
					}

					const response = await fetch(webhookUrl, {
						method: "POST",
						body: formData,
					});

					if (response.ok) {
						const sentFilesCount = files.length;
						addLog(`✅ Đã gửi ${sentFilesCount} file thành công!`);
						fileInput.value = ""; // Xóa file đã chọn
						document.getElementById("fileMessage").value = ""; // Xóa nội dung tin nhắn

						await Swal.fire({
							icon: "success",
							title: "Thành công!",
							text: `Bạn đã gửi ${sentFilesCount} file thành công.`,
							showConfirmButton: true,
						});
					} else {
						const error = await response.json();
						addLog(`❌ Lỗi khi gửi file: ${error.message || response.statusText}`, true);

						await Swal.fire({
							icon: "error",
							title: "Lỗi!",
							text: `Lỗi khi gửi file: ${error.message || response.statusText}`,
						});
					}
				} catch (error) {
					console.error("Lỗi khi gửi file:", error);
					addLog(`❌ Lỗi: ${error.message}`, true);

					await Swal.fire({
						icon: "error",
						title: "Lỗi!",
						text: `Lỗi khi gửi file: ${error.message}`,
					});
				}
			}

			// Thêm trường mới vào tin nhúng
			function addEmbedField() {
				const fieldsContainer = document.getElementById("embedFields");
				const fieldCount = fieldsContainer.children.length + 1;

				const fieldDiv = document.createElement("div");
				fieldDiv.className = "embed-field mb-3 p-2 border rounded";
				fieldDiv.innerHTML = `
                <div class="d-flex justify-content-between mb-2">
                    <h6>Trường ${fieldCount}</h6>
                    <button class="btn btn-sm btn-danger" onclick="removeEmbedField(this)">Xóa</button>
                </div>
                <input type="text" class="form-control mb-2" placeholder="Tên trường">
                <textarea class="form-control mb-2" placeholder="Giá trị"></textarea>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox">
                    <label class="form-check-label">Hiển thị cùng dòng</label>
                </div>
            `;

				fieldsContainer.appendChild(fieldDiv);
			}

			// Xóa trường tin nhúng
			function removeEmbedField(button) {
				if (document.querySelectorAll(".embed-field").length > 1) {
					button.closest(".embed-field").remove();
				} else {
					addLog("❌ Phải có ít nhất một trường", true);
				}
			}

			// Gửi tin nhắn nhúng
			async function sendEmbedMessage() {
				const webhooks = await getWebhookUrls();
				const selectedWebhookId = document.getElementById("webhookSelect").value;
				const webhookUrl = webhooks[selectedWebhookId];
				const title = document.getElementById("embedTitle").value;
				const description = document.getElementById("embedDescription").value;
				const color = document.getElementById("embedColorPicker").value;
				const footer = document.getElementById("embedFooter").value;
				const username = document.getElementById("customUsername").value;
				const avatarUrl = document.getElementById("avatarUrl").value;

				if (!title && !description) {
					addLog("❌ Vui lòng nhập tiêu đề hoặc mô tả", true);
					return;
				}

				// Thu thập các trường
				const fields = [];
				document.querySelectorAll(".embed-field").forEach((field) => {
					const name = field.querySelector('input[type="text"]').value;
					const value = field.querySelector("textarea").value;
					const inline = field.querySelector('input[type="checkbox"]').checked;

					if (name && value) {
						fields.push({
							name: name,
							value: value,
							inline: inline,
						});
					}
				});

				const embed = {
					title: title,
					description: description,
					color: parseInt(color.replace("#", ""), 16) || 0x5865f2, // Mặc định là màu xanh Discord
					fields: fields,
					footer: {
						text: footer || `Hệ thống thông báo - ${new Date().toLocaleString("vi-VN")}`,
					},
				};

				const payload = {
					embeds: [embed],
				};

				if (username) payload.username = username;
				if (avatarUrl) payload.avatar_url = avatarUrl;

				try {
					const response = await fetch(webhookUrl, {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
						},
						body: JSON.stringify(payload),
					});

					if (response.ok) {
						addLog("✅ Đã gửi tin nhúng thành công!");
						// Xóa form
						document.getElementById("embedTitle").value = "";
						document.getElementById("embedDescription").value = "";
						document.getElementById("embedColorPicker").value = "#5865F2";
						document.getElementById("embedFooter").value = "";
						// Giữ lại 1 trường trống
						const fieldsContainer = document.getElementById("embedFields");
						fieldsContainer.innerHTML = "";
						addEmbedField();

						await Swal.fire({
							icon: "success",
							title: "Thành công!",
							text: "Tin nhúng đã được gửi thành công.",
							showConfirmButton: true,
						});
					} else {
						const error = await response.text();
						addLog(`❌ Lỗi khi gửi tin nhúng: ${error}`, true);

						await Swal.fire({
							icon: "error",
							title: "Lỗi!",
							text: "Đã xảy ra lỗi khi gửi tin nhúng: " + error.message,
						});
					}
				} catch (error) {
					addLog(`❌ Lỗi kết nối: ${error.message}`, true);

					await Swal.fire({
						icon: "error",
						title: "Lỗi!",
						text: "Không thể gửi tin nhúng: " + error.message,
					});
				}
			}

			// Biến lưu template hiện tại
			let currentTemplate = null;

			// Định nghĩa các mẫu tin nhắn
			const messageTemplates = {
				rollback_thất_bại: {
					content: `❓ THÔNG BÁO ❓
		🆎 Nội Dung: Rollback thất bại
		💳 Tài Khoản: 
		👤 ID Nhân Vật: 
		🖥️ Máy Chủ: Võ Lâm Tây Vực - 
		⚠️ Lý Do: 
		🕙 Thời gian: ${getCurrentTime()}
		Vui lòng kiểm tra và trả lại Account cho khách hàng!
		@everyone`,
				},

				thong_bao: {
					content: `🔔 **THÔNG BÁO** 🔔
		📢 __**Nội Dung:**__ 
		⚠️ __**Lý Do:**__
		🕙 __**Thời gian:**__ ${getCurrentTime()}
		@everyone`,
				},

				bao_tri: {
					content: `🔔 **THÔNG BÁO** 🔔
		📢 __**Nội Dung:**__ Bảo trì hoàn tất
		🕙 __**Thời gian:**__ ${getCurrentTime()}
		@everyone`,
				},

				ip: {
					content: `🔔 **THÔNG BÁO** 🔔
		📢 __**Nội Dung:**__ Bỏ giới hạn cho IP  hoàn tất
		🕙 __**Thời gian:**__ ${getCurrentTime()}
		@everyone`,
				},

				canh_bao: {
					content: `❓ **THÔNG BÁO** ❓
		📢 __**Nội Dung:**__ 
		⚠️ __**Lý Do:**__
		🕙 __**Thời gian:**__ ${getCurrentTime()}
		@everyone`,
				},
			};

			// Áp dụng mẫu tin nhắn đã chọn
			function applyTemplate(templateId) {
				const templateSelect = document.getElementById("templateSelect");
				const messageText = document.getElementById("messageText");

				if (!templateId) {
					// Khi chọn "-- Chọn mẫu tin nhắn --"
					messageText.value = "";
					currentTemplate = null;
					templateSelect.selectedIndex = 0;
					return;
				}

				const template = messageTemplates[templateId];
				if (!template) return;

				// Áp dụng nội dung mẫu
				messageText.value = template.content;
				currentTemplate = templateId;
			}

			// Reset dropdown khi click vào option đầu tiên
			document.querySelector('#templateSelect option[value=""]').addEventListener("click", function () {
				currentTemplate = null;
				document.getElementById("messageText").value = "";
			});

			// Khởi tạo
			document.addEventListener("DOMContentLoaded", function () {
				// Thêm sự kiện cho các tab
				const tabEls = document.querySelectorAll('button[data-bs-toggle="tab"]');
				tabEls.forEach((tabEl) => {
					tabEl.addEventListener("shown.bs.tab", function (event) {
						// Có thể thêm xử lý khi chuyển tab ở đây
					});
				});

				// Thêm sự kiện cho nút gửi bằng phím Enter trong textarea
				document.getElementById("messageText").addEventListener("keydown", function (e) {
					if (e.key === "Enter" && e.ctrlKey) {
						e.preventDefault();
						sendTextMessage();
					}
				});

				// Xử lý sự kiện thay đổi màu
				document.getElementById("embedColorPicker").addEventListener("change", function () {
					const color = this.value.substring(1); // Loại bỏ ký tự #
					document.getElementById("embedColor").value = color.toUpperCase();
				});
			});

			async function scheduleMessage(type = "text") {
				const { value: minutes } = await Swal.fire({
					title: "Hẹn giờ gửi tin nhắn",
					input: "number",
					inputLabel: "Nhập số phút hẹn giờ",
					inputPlaceholder: "Nhập số phút (tối thiểu 1 phút)",
					inputValue: "5",
					inputAttributes: {
						min: "1",
						step: "1",
					},
					showCancelButton: true,
					cancelButtonText: "Hủy",
					confirmButtonText: "Xác nhận",
					inputValidator: (value) => {
						if (!value || parseInt(value) < 1) {
							return "Vui lòng nhập số phút hợp lệ (từ 1 phút trở lên)";
						}
					},
				});

				if (!minutes) return;

				const minutesNum = parseInt(minutes);
				const now = new Date();
				const scheduledTime = new Date(now.getTime() + minutesNum * 60000);

				// Xác định loại tin nhắn
				let messageType = "tin nhắn";
				if (type === "file") messageType = "file đính kèm";
				else if (type === "embed") messageType = "tin nhúng";

				const { isConfirmed } = await Swal.fire({
					title: "Xác nhận hẹn giờ",
					html: `Bạn có chắc muốn gửi ${messageType} sau <b>${minutesNum} phút</b>?<br>(Lúc ${scheduledTime.getHours()}:${scheduledTime.getMinutes().toString().padStart(2, "0")})`,
					icon: "question",
					showCancelButton: true,
					cancelButtonText: "Hủy",
					confirmButtonText: "Xác nhận",
					confirmButtonColor: "#3085d6",
					cancelButtonColor: "#d33",
				});

				if (isConfirmed) {
					let timeLeft = minutesNum * 60; // Chuyển đổi sang giây
					let timerInterval;
					let isCancelled = false;

					// Hàm cập nhật giao diện đếm ngược
					const updateTimer = () => {
						timeLeft--;
						const minutesLeft = Math.floor(timeLeft / 60);
						const secondsLeft = timeLeft % 60;

						swal.update({
							html: `
								<div class="text-center">
									<h4>Đang đếm ngược để gửi ${messageType}</h4>
									<div class="my-3">
										<strong>${minutesLeft}:${secondsLeft.toString().padStart(2, "0")}</strong>
									</div>
									<progress value="${timeLeft}" max="${minutesNum * 60}" style="width: 100%; height: 20px;"></progress>
									<div class="mt-2">
										<small>${messageType.charAt(0).toUpperCase() + messageType.slice(1)} sẽ được gửi lúc: <b>${scheduledTime.getHours()}:${scheduledTime.getMinutes().toString().padStart(2, "0")}</b></small>
									</div>
								</div>
							`,
						});

						if (timeLeft <= 0) {
							clearInterval(timerInterval);
							if (!isCancelled) {
								swal.close();
								// Gọi hàm gửi tin nhắn tương ứng với loại
								if (type === "file") {
									sendFileMessage();
								} else if (type === "embed") {
									sendEmbedMessage();
								} else {
									sendTextMessage();
								}
								showSuccessMessage(`Đã gửi ${messageType} theo lịch hẹn`);
							}
						}
					};

					// Hiển thị hộp thoại đếm ngược
					swal.fire({
						title: `Đã đặt lịch gửi ${messageType}`,
						html: `
							<div class="text-center">
								<h4>Đang đếm ngược để gửi ${messageType}</h4>
								<div class="my-3">
									<strong>${minutesNum}:00</strong>
								</div>
								<progress value="${minutesNum * 60}" max="${minutesNum * 60}" style="width: 100%; height: 20px;"></progress>
								<div class="mt-2">
									<small>${messageType.charAt(0).toUpperCase() + messageType.slice(1)} sẽ được gửi lúc: <b>${scheduledTime.getHours()}:${scheduledTime.getMinutes().toString().padStart(2, "0")}</b></small>
								</div>
							</div>
						`,
						showConfirmButton: true,
						confirmButtonText: "Hủy bỏ",
						allowOutsideClick: false,
						didOpen: () => {
							timerInterval = setInterval(updateTimer, 1000);
						},
						willClose: () => {
							isCancelled = true;
							clearInterval(timerInterval);
						},
					});
				}
			}

			// Hàm hiển thị thông báo thành công
			function showSuccessMessage(message) {
				swal.fire({
					title: "Thành công!",
					text: message,
					icon: "success",
					timer: 3000,
					timerProgressBar: true,
					showConfirmButton: false,
				});
			}
		</script>
	</body>
